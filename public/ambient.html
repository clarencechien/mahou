<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背景模式 — mahou</title>
<style>
  /* 背景模式跟遊戲不一樣：這裡沒有像素風，主角是照片跟字。
     深色底、細字距、大量留白——它要在電視上放一整場都不吵。 */
  * { box-sizing: border-box; }
  :root {
    --ink: #f2f5fa;
    --dim: #9fb0c9;
    --line: rgba(150,175,210,.22);
    --card: rgba(10,14,24,.72);
    --accent: #7dd3fc;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: #05080f; color: var(--ink); overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* ---- 背景：兩層交叉淡入，配上很慢的推鏡 ---- */
  #bgWrap { position: fixed; inset: 0; z-index: 0; background: #05080f; }
  .bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2.4s ease;
    animation: drift 46s ease-in-out infinite alternate;
  }
  .bg.on { opacity: 1; }
  @keyframes drift { from { transform: scale(1.06) translate(0, 0); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
  @media (prefers-reduced-motion: reduce) { .bg { animation: none; } }
  /* 照片上要讀字，一定要壓一層：上下重、中間輕 */
  #veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(4,7,14,.78) 0%, rgba(4,7,14,.22) 32%, rgba(4,7,14,.30) 62%, rgba(4,7,14,.86) 100%),
      radial-gradient(120% 80% at 50% 45%, rgba(4,7,14,0) 40%, rgba(4,7,14,.55) 100%);
  }

  /* ---- 舞台 ---- */
  #stage { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 40px 56px 26px; }
  #head { display: flex; align-items: flex-start; gap: 20px; }
  #titleBox { min-width: 0; }
  #tJp { font-size: 2.6rem; font-weight: 800; letter-spacing: .02em; line-height: 1.2; text-shadow: 0 3px 24px rgba(0,0,0,.7); }
  #tZh { color: var(--dim); font-size: 1.15rem; margin-top: 6px; letter-spacing: .12em; }
  #plTag { margin-left: auto; color: var(--dim); font-size: .82rem; letter-spacing: .16em; white-space: nowrap; padding-top: 10px; }

  /* 跟隨模式：現在這句最亮，前後各留幾句當上下文 */
  /* 跟隨模式是自己推的視窗，不是 flex 置中——26 句排下去一定比框高，
     置中只會讓頭尾兩端被切掉（上面貼到畫面外、下面壓在控制列底下）。
     所以外框 overflow:hidden，裡層整條平移，把當下那句推到正中央。 */
  #lyrics { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #lyricsInner { position: absolute; left: 0; right: 0; top: 0; transition: transform .55s cubic-bezier(.2,.75,.2,1); }
  #lyrics.all { overflow-y: auto; scrollbar-width: thin; }
  #lyrics.all #lyricsInner { position: static; transform: none !important; padding: 12px 0; }
  @media (prefers-reduced-motion: reduce) { #lyricsInner { transition: none; } }
  .ln { text-align: center; padding: 7px 0; transition: opacity .5s, filter .5s, transform .5s; }
  .ln .jp { font-size: 1.9rem; font-weight: 700; line-height: 1.45; text-shadow: 0 2px 18px rgba(0,0,0,.8); }
  .ln .zh { color: #cfe0f4; font-size: 1.05rem; margin-top: 2px; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .ln .rm { color: var(--dim); font-size: .82rem; letter-spacing: .06em; margin-top: 2px; }
  .ln.off { opacity: .26; filter: blur(.6px); }
  .ln.near { opacity: .58; }
  .ln.cur .jp { color: #fff; transform: scale(1.04); }
  .ln.cur { opacity: 1; }
  .sec { color: var(--accent); font-size: .72rem; letter-spacing: .22em; opacity: .5; margin: 14px 0 2px; }
  body:not(.showRomaji) .rm { display: none; }

  /* ---- 控制列 ---- */
  #bar {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 18px; backdrop-filter: blur(10px);
    transition: opacity .35s, transform .35s;
  }
  body.idle #bar { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
         font-size: 1.1rem; background: rgba(120,150,190,.12); }
  .ico:hover { background: rgba(120,150,190,.24); }
  #play { width: 52px; height: 52px; font-size: 1.4rem; background: rgba(125,211,252,.18); color: #cdefff; }
  #seek { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
  #track { flex: 1; height: 6px; background: rgba(150,175,210,.2); border-radius: 4px; position: relative; cursor: pointer; }
  #track i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 4px; }
  .tnum { font-family: ui-monospace, monospace; font-size: .82rem; color: var(--dim); white-space: nowrap; }
  .seg { display: flex; gap: 3px; background: rgba(120,150,190,.12); border-radius: 11px; padding: 3px; }
  .seg button { padding: 7px 12px; border-radius: 9px; font-size: .8rem; color: var(--dim); white-space: nowrap; }
  .seg button.on { background: rgba(125,211,252,.2); color: #cdefff; }
  #vol { width: 84px; accent-color: var(--accent); }

  /* ---- 縮小：只剩歌名 ---- */
  body.m-mini #stage { display: none; }
  body.m-mini #veil { background: none; }
  body.m-widget #stage { display: none; }
  body.m-widget #veil { background: none; }
  #dock {
    position: fixed; right: 22px; bottom: 22px; z-index: 3; display: none;
    width: 400px; max-width: calc(100vw - 44px);
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(14px); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden;
  }
  body.m-mini #dock, body.m-widget #dock { display: block; }
  body.m-mini #dock { width: auto; }
  #dockHead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  #dockTitle { min-width: 0; flex: 1; }
  #dockTitle b { display: block; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dockTitle span { display: block; color: var(--dim); font-size: .76rem; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.m-mini #dockTitle span, body.m-mini #dockBody, body.m-mini #dockTrack { display: none; }
  #dockTrack { height: 3px; background: rgba(150,175,210,.18); }
  #dockTrack i { display: block; height: 100%; width: 0%; background: var(--accent); }
  #dockBody { max-height: 46vh; overflow-y: auto; padding: 12px 16px 14px; scrollbar-width: thin; }
  #dockBody .ln { text-align: left; padding: 5px 0; }
  #dockBody .ln .jp { font-size: 1.02rem; line-height: 1.4; }
  #dockBody .ln .zh { font-size: .84rem; }
  #dockBody .ln .rm { font-size: .72rem; }
  #dockBody .sec { margin: 10px 0 0; }
  #dockFoot { display: flex; align-items: center; gap: 8px; padding: 0 14px 12px; }
  #dockFoot .seg button { padding: 5px 10px; font-size: .74rem; }

  /* ---- 開場：瀏覽器不讓網頁自己出聲，一定要先有一次點擊 ---- */
  #gate {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: rgba(4,7,14,.86); backdrop-filter: blur(8px); text-align: center; padding: 24px;
  }
  #gate h1 { font-size: 2.2rem; margin: 0; font-weight: 800; letter-spacing: .04em; }
  #gate p { color: var(--dim); margin: 0; line-height: 1.8; font-size: .95rem; }
  #gateGo { padding: 16px 46px; border-radius: 999px; background: rgba(125,211,252,.2);
            border: 1px solid rgba(125,211,252,.4); font-size: 1.1rem; font-weight: 700; color: #cdefff; }
  #gate.off { display: none; }
  #credit { position: fixed; left: 14px; bottom: 10px; z-index: 3; color: rgba(159,176,201,.5); font-size: .68rem; letter-spacing: .06em; }
  body.m-mini #credit, body.m-widget #credit { display: none; }
  a { color: inherit; }
</style>
</head>
<body class="m-stage">
<div id="bgWrap"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div></div>
<div id="veil"></div>

<div id="stage">
  <div id="head">
    <div id="titleBox">
      <div id="tJp">—</div>
      <div id="tZh"></div>
    </div>
    <div id="plTag"></div>
  </div>
  <div id="lyrics"><div id="lyricsInner"></div></div>
  <div id="bar">
    <button class="ico" id="prev" title="上一首（←）">⏮</button>
    <button class="ico" id="play" title="播放／暫停（空白鍵）">▶</button>
    <button class="ico" id="next" title="下一首（→）">⏭</button>
    <div id="seek">
      <span class="tnum" id="tNow">0:00</span>
      <div id="track"><i></i></div>
      <span class="tnum" id="tEnd">0:00</span>
    </div>
    <div class="seg" id="plSeg"></div>
    <div class="seg" id="bgSeg"></div>
    <div class="seg" id="lyrSeg">
      <button data-l="follow">跟隨</button>
      <button data-l="all">完整</button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-m="stage">舞台</button>
      <button data-m="widget">Widget</button>
      <button data-m="mini">縮小</button>
    </div>
    <button class="ico" id="romaji" title="羅馬拼音（R）">あ</button>
    <input type="range" id="vol" min="0" max="1" step="0.02" value="0.7" title="音量">
    <button class="ico" id="fs" title="全螢幕（F）">⛶</button>
  </div>
</div>

<div id="dock">
  <div id="dockHead">
    <button class="ico" id="dPlay">▶</button>
    <div id="dockTitle"><b>—</b><span></span></div>
    <button class="ico" id="dNext" title="下一首">⏭</button>
    <button class="ico" id="dBack" title="回舞台">⤢</button>
  </div>
  <div id="dockTrack"><i></i></div>
  <div id="dockBody"></div>
  <div id="dockFoot">
    <div class="seg" id="dLyrSeg">
      <button data-l="follow">跟隨歌詞</button>
      <button data-l="all">完整歌詞</button>
    </div>
    <button class="ico" id="dMini" title="只留歌名">▁</button>
  </div>
</div>

<div id="credit"></div>

<div id="gate">
  <h1>背景模式</h1>
  <p id="gateNote">載入中…</p>
  <button id="gateGo">▶ 開始播放</button>
  <p style="font-size:.78rem; opacity:.6">空白鍵 播放／暫停・← → 換歌・1 2 3 換歌單<br>S 舞台・W widget・M 縮小・L 歌詞模式・B 換背景・F 全螢幕</p>
</div>

<audio id="au" preload="metadata"></audio>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const au = $('#au');

  // ---- 設定 ----
  let CFG = null, PL = [], BACK = [], AUDIO_BASE = '';
  let plIdx = 0, songIdx = 0, song = null, lineEls = [], active = -1;
  let mode = 'stage', lyrMode = 'follow', romaji = false;
  let follow = true, followTimer = 0;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('mahou-ambient-' + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('mahou-ambient-' + k, v); } catch (e) {} },
  };
  const mmss = (s) => (isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00');
  const esc = (s) => { const d = document.createElement('span'); d.textContent = s ?? ''; return d.innerHTML; };

  // ---- 背景輪播 ----
  // 兩層交叉淡入。圖是直接連對方圖床的，載不到就跳過那張，畫面不會空白。
  const layers = [$('#bgA'), $('#bgB')];
  let layerTop = 0, bgPool = [], bgAt = -1, bgTimer = 0, bgIdx = 0;
  function bgShow(url) {
    const img = new Image();
    img.onload = () => {
      const next = layers[1 - layerTop];
      next.style.backgroundImage = `url("${url}")`;
      next.classList.add('on');
      layers[layerTop].classList.remove('on');
      layerTop = 1 - layerTop;
    };
    img.onerror = () => bgNext();          // 這張掛了就換下一張，不要卡住
    img.src = url;
  }
  function bgNext() {
    if (!bgPool.length) return;
    bgAt = (bgAt + 1) % bgPool.length;
    bgShow(bgPool[bgAt]);
    const nx = bgPool[(bgAt + 1) % bgPool.length];   // 下一張先抓，切換才不會空一拍
    if (nx) new Image().src = nx;
  }
  // 背景來源有兩種：固定網址清單（場地官網），或一份清單檔（自己挑過的相簿）。
  // 相簿的清單放本機、圖片本體讀 family-feast 的 /media/——都是自己的東西，
  // 只是不想把 180 張照片再複製一份進這個 repo。
  async function setBackdrop(i) {
    const b = BACK[i];
    if (!b) return;
    bgIdx = i;
    store.set('bg', i);
    $('#bgSeg').querySelectorAll('button').forEach((x, k) => x.classList.toggle('on', k === i));
    let urls = b.images || [];
    if (b.manifest) {
      try {
        const r = await fetch(b.manifest);
        const j = await r.json();
        urls = (j.items || j.photos || [])
          .filter((it) => !it.video && it.r2)
          .map((it) => (b.urlBase || '') + it.r2 + (b.suffix || ''));
      } catch (e) { urls = []; }
    }
    if (!urls.length) { $('#credit').textContent = (b.name || '') + '：載不到清單'; return; }
    bgPool = shuffle(urls);
    bgAt = -1;
    $('#credit').textContent = '背景：' + (b.credit || b.name) + '　' + bgPool.length + ' 張';
    bgNext();
  }
  // 洗牌：同一場活動放好幾個小時，照原順序會一直看到同樣的開頭
  function shuffle(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; }
    return x;
  }
  function bgStart() {
    clearInterval(bgTimer);
    bgTimer = setInterval(bgNext, 20000);
  }

  // ---- 歌詞 ----
  function lineHTML(l) {
    return `<div class="jp">${esc(l.jp || l.zh || '')}</div>` +
      (l.zh && l.jp ? `<div class="zh">${esc(l.zh)}</div>` : '') +
      (l.romaji ? `<div class="rm">${esc(l.romaji)}</div>` : '');
  }
  function renderLyrics() {
    const hosts = [$('#lyricsInner'), $('#dockBody')];
    lineEls = [];
    for (const host of hosts) {
      host.innerHTML = '';
      let sec = null;
      const els = [];
      (song.lines || []).forEach((l) => {
        if (l.section && l.section !== sec) {
          sec = l.section;
          const s = document.createElement('div');
          s.className = 'sec'; s.textContent = sec;
          host.appendChild(s);
        }
        const el = document.createElement('div');
        el.className = 'ln off';
        el.innerHTML = lineHTML(l);
        host.appendChild(el);
        els.push(el);
      });
      lineEls.push(els);
    }
    active = -1;
  }
  function paint(i) {
    lineEls.forEach((els, host) => {
      els.forEach((el, k) => {
        const d = Math.abs(k - i);
        el.className = 'ln ' + (k === i ? 'cur' : d <= 1 ? 'near' : 'off');
      });
      const el = els[i];
      if (!el) return;
      if (host === 0 && lyrMode === 'follow') {
        // 舞台的跟隨模式：整條歌詞平移，讓當下那句停在框的正中央
        const box = $('#lyrics'), inner = $('#lyricsInner');
        inner.style.transform = `translateY(${box.clientHeight / 2 - (el.offsetTop + el.offsetHeight / 2)}px)`;
      } else if (follow && el.offsetParent) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });
  }
  function lineAt(t) {
    const ls = song.lines || [];
    let i = -1;
    for (let k = 0; k < ls.length; k++) if (t >= ls[k].t + (song.offset || 0)) i = k; else break;
    return i;
  }

  // ---- 播放 ----
  function songList() { return (PL[plIdx] && PL[plIdx].songs) || []; }
  async function loadSong(i, autoplay) {
    const ids = songList();
    if (!ids.length) return;
    songIdx = ((i % ids.length) + ids.length) % ids.length;
    const id = ids[songIdx];
    try {
      const r = await fetch('/ambient/songs/' + id + '.json');
      if (!r.ok) throw new Error(r.status);
      song = await r.json();
    } catch (e) {
      $('#gateNote').textContent = '歌曲載不到：' + id;
      return;
    }
    // song.audio 是 music/xxx.mp3；/audio/ 那條路由只吃檔名
    const rel = (song.audio || '').replace(/^music\//, '');
    au.src = AUDIO_BASE + (AUDIO_BASE === '/audio/' ? encodeURIComponent(rel) : (song.audio || ''));
    $('#tJp').textContent = song.title || '';
    $('#tZh').textContent = [song.titleZh, song.subtitle].filter(Boolean).join('　·　');
    $('#dockTitle b').textContent = song.titleZh || song.title || '';
    $('#dockTitle span').textContent = song.title && song.titleZh ? song.title : (song.subtitle || '');
    $('#tEnd').textContent = mmss(song.duration || 0);
    renderLyrics();
    bgNext();                                    // 換歌就換一張背景
    if (autoplay) au.play().catch(() => {});
  }
  const setPlay = (on) => { $('#play').textContent = on ? '⏸' : '▶'; $('#dPlay').textContent = on ? '⏸' : '▶'; };
  au.addEventListener('play', () => setPlay(true));
  au.addEventListener('pause', () => setPlay(false));
  au.addEventListener('ended', () => loadSong(songIdx + 1, true));
  au.addEventListener('error', () => { $('#gateNote').textContent = '這首的音檔載不到，跳下一首'; setTimeout(() => loadSong(songIdx + 1, true), 800); });
  au.addEventListener('timeupdate', () => {
    const d = au.duration || song?.duration || 0;
    const p = d ? (au.currentTime / d) * 100 : 0;
    $('#track i').style.width = p + '%';
    $('#dockTrack i').style.width = p + '%';
    $('#tNow').textContent = mmss(au.currentTime);
    if (!song) return;
    const i = lineAt(au.currentTime);
    if (i !== active) { active = i; paint(i); }
  });

  // ---- 版面模式 ----
  function setMode(m) {
    mode = m;
    document.body.className = 'm-' + m + (romaji ? ' showRomaji' : '');
    $('#modeSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    store.set('mode', m);
    idlePoke();
  }
  function setLyrMode(l) {
    lyrMode = l;
    $('#lyrics').classList.toggle('all', l === 'all');
    // 完整模式是「你在讀歌詞」，自動捲動會把你正在看的那行拉走，所以關掉跟隨
    follow = l === 'follow';
    [...document.querySelectorAll('#lyrSeg button, #dLyrSeg button')]
      .forEach((b) => b.classList.toggle('on', b.dataset.l === l));
    store.set('lyr', l);
    if (l !== 'follow') $('#lyricsInner').style.transform = '';
    if (active >= 0) paint(active);
  }
  function setRomaji(on) {
    romaji = on;
    document.body.classList.toggle('showRomaji', on);
    $('#romaji').style.opacity = on ? 1 : .45;
    store.set('romaji', on ? '1' : '0');
  }
  function setPlaylist(i) {
    if (!PL[i] || !PL[i].songs.length) return;
    plIdx = i;
    $('#plTag').textContent = PL[i].name;
    $('#plSeg').querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === i));
    store.set('pl', i);
    loadSong(0, !au.paused);
  }

  // 舞台模式閒置就把控制列收起來——它是背景，不是儀表板
  let idleTimer = 0;
  function idlePoke() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    if (mode === 'stage') idleTimer = setTimeout(() => document.body.classList.add('idle'), 3500);
  }
  ['mousemove', 'keydown', 'pointerdown'].forEach((e) => addEventListener(e, idlePoke));
  addEventListener('resize', () => { if (active >= 0) paint(active); });

  // ---- 綁事件 ----
  const toggle = () => (au.paused ? au.play().catch(() => {}) : au.pause());
  $('#play').onclick = toggle;
  $('#dPlay').onclick = toggle;
  $('#prev').onclick = () => loadSong(songIdx - 1, !au.paused);
  $('#next').onclick = () => loadSong(songIdx + 1, !au.paused);
  $('#dNext').onclick = () => loadSong(songIdx + 1, !au.paused);
  $('#dBack').onclick = () => setMode('stage');
  $('#dMini').onclick = () => setMode(mode === 'mini' ? 'widget' : 'mini');
  $('#romaji').onclick = () => setRomaji(!romaji);
  $('#fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}));
  $('#vol').oninput = (e) => { au.volume = +e.target.value; store.set('vol', e.target.value); };
  $('#track').onclick = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const d = au.duration || song?.duration || 0;
    if (d) au.currentTime = d * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  };
  [...document.querySelectorAll('#lyrSeg button, #dLyrSeg button')].forEach((b) => (b.onclick = () => setLyrMode(b.dataset.l)));
  $('#modeSeg').querySelectorAll('button').forEach((b) => (b.onclick = () => setMode(b.dataset.m)));
  // 完整模式下自己捲動時，暫停自動跟隨幾秒，不然讀到一半會被拉回去
  $('#lyrics').addEventListener('wheel', () => {
    // 只有完整模式會捲；跟隨模式是我們自己推的，滾輪不該影響它

    if (lyrMode !== 'all') return;
    follow = false; clearTimeout(followTimer);
    followTimer = setTimeout(() => { follow = true; }, 6000);
  }, { passive: true });

  addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select')) return;
    const k = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') loadSong(songIdx + 1, !au.paused);
    else if (e.key === 'ArrowLeft') loadSong(songIdx - 1, !au.paused);
    else if (k === 's') setMode('stage');
    else if (k === 'w') setMode('widget');
    else if (k === 'm') setMode('mini');
    else if (k === 'l') setLyrMode(lyrMode === 'follow' ? 'all' : 'follow');
    else if (k === 'r') setRomaji(!romaji);
    else if (k === 'f') $('#fs').click();
    else if (k === 'b') setBackdrop((bgIdx + 1) % Math.max(1, BACK.length));
    else if ('123'.includes(e.key)) setPlaylist(+e.key - 1);
  });

  // ---- 起動 ----
  (async () => {
    try {
      const r = await fetch('/ambient/playlists.json');
      CFG = await r.json();
    } catch (e) {
      $('#gateNote').textContent = '設定檔載不到：' + (e.message || e);
      return;
    }
    AUDIO_BASE = CFG.audioBase || '';
    PL = (CFG.playlists || []).map((p) => ({ ...p, songs: p.songs || [] }));
    BACK = CFG.backdrops || [];
    $('#bgSeg').innerHTML = BACK.map((b, i) => `<button data-b="${i}">${esc(b.name)}</button>`).join('');
    $('#bgSeg').querySelectorAll('button').forEach((b, i) => (b.onclick = () => setBackdrop(i)));
    $('#plSeg').innerHTML = PL.map((p, i) =>
      `<button data-p="${i}" ${p.songs.length ? '' : 'disabled style="opacity:.35"'}>${esc(p.name)}</button>`).join('');
    $('#plSeg').querySelectorAll('button').forEach((b, i) => (b.onclick = () => setPlaylist(i)));

    setMode(store.get('mode', 'stage'));
    setLyrMode(store.get('lyr', 'follow'));
    setRomaji(store.get('romaji', '0') === '1');
    au.volume = +store.get('vol', '0.7');
    $('#vol').value = au.volume;
    const savedPl = +store.get('pl', 0);
    plIdx = PL[savedPl] && PL[savedPl].songs.length ? savedPl : PL.findIndex((p) => p.songs.length);
    if (plIdx < 0) { $('#gateNote').textContent = '歌單裡沒有歌'; return; }
    $('#plTag').textContent = PL[plIdx].name;
    $('#plSeg').querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === plIdx));

    const savedBg = +store.get('bg', 0);
    await setBackdrop(BACK[savedBg] ? savedBg : 0);
    await loadSong(0, false);
    const n = songList().length;
    $('#gateNote').innerHTML = `${esc(PL[plIdx].name)}・${n} 首<br><span style="opacity:.7">瀏覽器不讓網頁自己出聲，按一下就開始</span>`;
  })();

  $('#gateGo').onclick = () => {
    $('#gate').classList.add('off');
    bgStart();
    au.play().catch(() => { $('#gate').classList.remove('off'); $('#gateNote').textContent = '播不起來，再按一次'; });
    idlePoke();
  };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>手把 — 家宴 POC</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, sans-serif; background: #111827; color: #f9fafb;
    touch-action: none; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; padding: 16px; gap: 12px;
  }
  h1 { font-size: 1.1rem; color: #9ca3af; }
  .stage { display: none; flex: 1; flex-direction: column; gap: 14px; }
  .stage.active { display: flex; }
  .big { font-size: 3.2rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { color: #9ca3af; text-align: center; font-size: .95rem; }
  button, input {
    font-size: 1.15rem; padding: 14px; border-radius: 12px; border: none; width: 100%;
  }
  input { background: #1f2937; color: #f9fafb; text-align: center; }
  button { background: #2563eb; color: #fff; font-weight: 700; }
  button:disabled { opacity: .4; }
  .light { width: 20px; height: 20px; border-radius: 50%; display: inline-block; background: #4b5563; vertical-align: middle; }
  .good { background: #22c55e !important; color: #052e16; }
  .warn { background: #eab308 !important; color: #422006; }
  .bad  { background: #ef4444 !important; color: #fff; }
  .light.good { background: #22c55e !important; } .light.warn { background: #eab308 !important; } .light.bad { background: #ef4444 !important; }
  #tapBtn {
    flex: 1; font-size: 2rem; border-radius: 24px; background: #374151; transition: none;
  }
  #tapBtn.flash { background: #22c55e; color: #052e16; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .slider { display: grid; grid-template-columns: 7.5em 1fr 3.5em; gap: 8px; align-items: center; font-size: .85rem; color: #d1d5db; }
  .slider input[type=range] { padding: 0; }
  .card { background: #1f2937; border-radius: 12px; padding: 12px; }
  .stat { font-size: .9rem; color: #d1d5db; line-height: 1.7; }
  #gate { position: fixed; inset: 0; background: #111827; z-index: 10; display: none; flex-direction: column; gap: 16px; padding: 24px; justify-content: center; }
  #colorGrid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .colorBlock { border: none; border-radius: 18px; padding: 0; }
  .colorBlock.picked { outline: 5px solid #fff; outline-offset: -5px; }
  .colorBlock.isTarget { outline: 6px solid #22c55e; outline-offset: -6px; }
  .colorBlock.picked.wrong { outline-color: #ef4444; }
  #fzBig { flex:1; border-radius:24px; border:none; font-size:2rem; font-weight:800; background:#374151; color:#fff; }
  #fzBig.hit { background:#22c55e; color:#052e16; }
  .fzColors { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; }
  .fzColors button { border-radius:18px; font-size:0; }
  body.fzFreeze { background:#7f1d1d; }
  #speedTrack { height: 20px; background: #1f2937; border-radius: 10px; overflow: hidden; }
  #skiSpeedBar { height: 100%; width: 0%; background: #38bdf8; border-radius: 10px; }
</style>
</head>
<body>
<h1>家宴 POC 手把 <span id="roomLabel"></span> <span id="connDot" class="light"></span></h1>

<!-- in-app browser 阻擋（LINE / FB 掃碼會進內建瀏覽器，感測器權限拿不到） -->
<div id="gate">
  <div class="big" style="font-size:1.6rem">請用外部瀏覽器開啟</div>
  <p class="hint" id="gateWhy"></p>
  <p class="hint">點右上角選單 →「以瀏覽器開啟」，或複製連結貼到 Chrome：</p>
  <button id="copyLink">複製連結</button>
</div>

<!-- 步驟 1：加入 -->
<section id="st-join" class="stage active">
  <p class="hint">輸入暱稱（兩個字以內）</p>
  <input id="nick" maxlength="2" placeholder="暱稱" autocomplete="off">
  <button id="joinBtn">加入房間</button>
  <p class="hint" id="joinMsg"></p>
</section>

<!-- 大廳：等 host 切關卡 -->
<section id="st-lobby" class="stage">
  <div class="big" style="font-size:1.6rem" id="lobbyName"></div>
  <p class="hint">已加入，等主持人開始測試…</p>
  <div class="card stat" id="lobbyStat"></div>
</section>

<!-- 步驟 2：Ping 測試 -->
<section id="st-ping" class="stage">
  <p class="hint">RTT（來回延遲）</p>
  <div class="big"><span id="rttNow">–</span><span style="font-size:1.2rem"> ms</span></div>
  <div class="row"><span id="rttLight" class="light"></span></div>
  <div class="card stat" id="pingStat"></div>
</section>

<!-- 步驟 3：點擊測試 -->
<section id="st-tap" class="stage">
  <p class="hint" id="tapHint"></p>
  <div class="big" style="font-size:1.8rem" id="tapCount">0</div>
  <button id="tapBtn">點我</button>
  <button id="spamStartBtn" style="display:none">開始狂點（3 秒）</button>
  <div class="card stat" id="tapStat"></div>
</section>

<!-- 步驟 4：搖動計數 -->
<section id="st-shake" class="stage">
  <button id="motionBtn">啟用感測器</button>
  <p class="hint" id="shakeHint"></p>
  <div id="shakeUI" style="display:none; flex-direction:column; gap:12px; flex:1">
    <p class="hint">搖 10 下！</p>
    <div class="big" id="shakeCount">0</div>
    <button id="shakeReset" style="background:#374151">歸零</button>
    <div class="card">
      <div class="slider"><span>觸發門檻 <b id="vHi">3.5</b></span><input type="range" id="pHi" min="1" max="10" step="0.1" value="3.5"><span></span></div>
      <div class="slider"><span>解除門檻 <b id="vLo">1.5</b></span><input type="range" id="pLo" min="0.2" max="5" step="0.1" value="1.5"><span></span></div>
      <div class="slider"><span>不應期 <b id="vRef">120</b>ms</span><input type="range" id="pRef" min="40" max="400" step="10" value="120"><span></span></div>
    </div>
    <div class="card stat" id="shakeStat"></div>
  </div>
</section>

<!-- 木頭人・混合指令 -->
<section id="st-freeze" class="stage">
  <button id="fzPermBtn">啟用感測器</button>
  <div id="fzUI" style="display:none; flex-direction:column; gap:12px; flex:1">
    <div class="big" id="fzCmd" style="font-size:2.4rem">等主持人開始</div>
    <p class="hint" id="fzSub">綠燈時照指令做，紅燈不要動</p>
    <div id="fzArea" style="flex:1; display:flex; flex-direction:column; gap:10px"></div>
    <div class="card stat" id="fzStat"></div>
  </div>
</section>

<!-- 遊戲一：顏色反應 -->
<section id="st-color" class="stage">
  <p class="hint" id="colorMsg">看大螢幕，等出題…</p>
  <div id="colorGrid"></div>
  <div class="card stat" id="colorStat"></div>
</section>

<!-- 遊戲二：滑雪下坡 -->
<section id="st-ski" class="stage">
  <button id="skiPermBtn">啟用感測器</button>
  <div id="skiUI" style="display:none; flex-direction:column; gap:14px; flex:1">
    <p class="hint" id="skiMsg">等主持人開始…</p>
    <div class="big" style="font-size:2.2rem"><span id="skiDist">0</span><span style="font-size:1.1rem"> m</span></div>
    <canvas id="skiView" style="flex:1; width:100%; border-radius:14px; background:#eaf3fb; min-height:180px"></canvas>
    <div id="speedTrack"><div id="skiSpeedBar"></div></div>
    <p class="hint">上下用力搖！搖越快滑越快 ⛷️</p>
    <div class="card stat" id="skiStat"></div>
  </div>
</section>

<script src="/shared.js"></script>
<script>
(function () {
  const { $, Sock, ClockSync, Telemetry } = Mahou;

  // ---- 房號來自 QR：/client.html#ROOM ----
  const roomId = (location.hash.slice(1) || '').toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(roomId)) {
    document.body.innerHTML = '<p style="padding:24px">網址少了房號，請重新掃 QR code。</p>';
    return;
  }
  $('#roomLabel').textContent = '房 ' + roomId;

  // ---- in-app browser 阻擋 ----
  const iab = Mahou.inAppBrowser();
  if (iab) {
    $('#gate').style.display = 'flex';
    $('#gateWhy').textContent = `偵測到 ${iab} 內建瀏覽器，感測器權限會拿不到。`;
    // clipboard 也需要 transient activation，iOS 同樣認 click 不認 pointerdown
    $('#copyLink').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); $('#copyLink').textContent = '已複製 ✓'; }
      catch { prompt('手動複製這段網址：', location.href); }
    });
    return;
  }

  Mahou.keepAwake();

  // clientId 存 sessionStorage，斷線重整後身分不變
  const idKey = 'mahou-cid-' + roomId;
  const clientId = sessionStorage.getItem(idKey) || crypto.randomUUID();
  sessionStorage.setItem(idKey, clientId);

  const sock = new Sock(roomId, 'client');
  const clock = new ClockSync(sock);
  const telemetry = new Telemetry(sock);
  const device = Mahou.deviceFingerprint();
  let joined = false;
  let stage = 'lobby';

  sock.onOpen(() => {
    $('#connDot').className = 'light good';
    if (joined) doJoin(); // 重連自動重新加入
  });
  sock.ws.addEventListener('close', () => { $('#connDot').className = 'light bad'; });
  // 房間被結束（host 按鈕或閒置逾時）：停掉所有背景流量，讓 DO 能被回收
  sock.onEnded(() => {
    clock.stopBackground();
    document.body.innerHTML =
      '<div style="padding:40px 24px;text-align:center"><div style="font-size:2rem;font-weight:800">房間已結束</div>' +
      '<p style="color:#9ca3af;margin-top:12px">這個分頁可以關掉了</p></div>';
  });

  // ---- 步驟 1：加入 ----
  function doJoin() {
    sock.send({ type: 'join', clientId, name: $('#nick').value.trim() || '客', device });
  }
  $('#joinBtn').addEventListener('pointerdown', () => {
    if (!$('#nick').value.trim()) { $('#joinMsg').textContent = '先填暱稱'; return; }
    $('#joinMsg').textContent = '加入中…';
    doJoin();
  });
  sock.on('joined', async (m) => {
    joined = true;
    $('#lobbyName').textContent = $('#nick').value.trim() || '客';
    setStage(m.stage || 'lobby');
    // 進場自動對時（N=10 取最小 RTT），之後每 10 秒背景重測記漂移
    await clock.sync(10);
    clock.startBackground(10000);
    updateLobbyStat();
  });
  function updateLobbyStat() {
    if (!clock.rtt) return;
    $('#lobbyStat').innerHTML =
      `對時完成 ✓（每 10 秒背景重測）<br>` +
      `RTT min ${clock.rtt.min.toFixed(1)} / p50 ${clock.rtt.p50} / p95 ${clock.rtt.p95} ms`;
  }

  // ---- 關卡切換（host 廣播驅動） ----
  const stageMap = { lobby: 'st-lobby', ping: 'st-ping', 'tap-single': 'st-tap', 'tap-spam': 'st-tap', shake: 'st-shake', color: 'st-color', ski: 'st-ski', freeze: 'st-freeze' };
  sock.on('stage', (m) => setStage(m.stage));
  function setStage(s) {
    stage = s;
    document.querySelectorAll('.stage').forEach((el) => el.classList.remove('active'));
    const id = joined ? (stageMap[s] || 'st-lobby') : 'st-join';
    document.getElementById(id).classList.add('active');
    if (s === 'ping') startPingView(); else stopPingView();
    if (s === 'tap-single') setupTap('single');
    if (s === 'tap-spam') setupTap('spam');
    if (s === 'ski') setupSkiStage();
    if (s === 'freeze') setupFreezeStage(); else document.body.classList.remove('fzFreeze');
  }

  // ---- 步驟 2：Ping 畫面（1Hz 即時顯示） ----
  let pingTimer = null;
  function startPingView() {
    if (pingTimer) return;
    const tick = async () => {
      const s = await clock.pingOnce();
      if (stage !== 'ping') return;
      if (s) {
        $('#rttNow').textContent = s.rtt.toFixed(0);
        $('#rttLight').className = 'light ' + Mahou.rttClass(s.rtt);
      } else {
        $('#rttNow').textContent = '掉包';
        $('#rttLight').className = 'light bad';
      }
      if (clock.rtt) {
        const h = clock.history[clock.history.length - 1];
        $('#pingStat').innerHTML =
          `對時 RTT：min ${clock.rtt.min.toFixed(1)} / p50 ${clock.rtt.p50} / p95 ${clock.rtt.p95} / max ${clock.rtt.max.toFixed(1)} ms<br>` +
          `offset 漂移 ${h ? h.drift.toFixed(1) : 0}ms（經過 ${h ? Math.round(h.elapsedMs / 1000) : 0}s）<br>` +
          `重測次數 ${clock.history.length}`;
      }
    };
    tick();
    pingTimer = setInterval(tick, 1000);
  }
  function stopPingView() { clearInterval(pingTimer); pingTimer = null; }

  // ---- 步驟 3：點擊測試 ----
  let tapMode = 'single', tapSeq = 0, spamActive = false, spamEndsAt = 0;
  const tapLog = []; // {rtt, uplink, downlink}
  function setupTap(mode) {
    tapMode = mode; tapSeq = 0; tapLog.length = 0;
    $('#tapCount').textContent = '0';
    $('#tapStat').textContent = '';
    if (mode === 'single') {
      $('#tapHint').textContent = '單點模式：點 10 次，看延遲分布';
      $('#tapBtn').style.display = '';
      $('#spamStartBtn').style.display = 'none';
    } else {
      $('#tapHint').textContent = '狂點模式：按開始後 3 秒內盡量點';
      $('#tapBtn').style.display = 'none';
      $('#spamStartBtn').style.display = '';
      spamActive = false;
    }
  }
  $('#spamStartBtn').addEventListener('pointerdown', () => {
    tapSeq = 0; spamActive = true;
    spamEndsAt = performance.now() + 3000;
    sock.send({ type: 'spamStart' });
    $('#spamStartBtn').style.display = 'none';
    $('#tapBtn').style.display = '';
    setTimeout(() => {
      spamActive = false;
      $('#tapBtn').style.display = 'none';
      $('#spamStartBtn').style.display = '';
      $('#spamStartBtn').textContent = '再來一輪';
      sock.send({ type: 'spamDone', sent: tapSeq });
    }, 3000);
  });
  // 用 pointerdown（不是 click），本機立刻變色＝零延遲對照組
  $('#tapBtn').addEventListener('pointerdown', () => {
    if (tapMode === 'spam' && !spamActive) return;
    if (tapMode === 'single' && tapSeq >= 10) return;
    tapSeq++;
    $('#tapCount').textContent = tapSeq + (tapMode === 'single' ? ' / 10' : '');
    const btn = $('#tapBtn');
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 90);
    sock.send({ type: 'tap', seq: tapSeq, mode: tapMode, tClientSend: clock.serverNow() });
  });
  sock.on('tapAck', (m) => {
    const now = clock.serverNow();
    if (now == null || typeof m.tClientSend !== 'number') return;
    const uplink = m.tServerRecv - m.tClientSend;
    const downlink = now - m.tServerSend;
    tapLog.push({ uplink, downlink });
    telemetry.add({ kind: 'tapRtt', seq: m.seq, mode: m.mode, uplinkMs: uplink, downlinkMs: downlink, rttMs: uplink + downlink });
    if (tapMode === 'single') {
      const ups = tapLog.map((x) => x.uplink).sort((a, b) => a - b);
      const downs = tapLog.map((x) => x.downlink).sort((a, b) => a - b);
      $('#tapStat').innerHTML =
        `上行 p50 ${Mahou.pct(ups, 50)}ms / p95 ${Mahou.pct(ups, 95)}ms<br>` +
        `下行 p50 ${Mahou.pct(downs, 50)}ms / p95 ${Mahou.pct(downs, 95)}ms`;
    }
  });
  sock.on('spamSummary', (m) => {
    $('#tapStat').innerHTML = `送出 ${m.sent}／伺服器收到 ${m.received}<br>斷號 ${m.gaps}，掉包率 <b>${m.lossPct}%</b>`;
  });

  // ---- 步驟 4：搖動計數 ----
  // 演算法照 handoff §4：accelerationIncludingGravity → 低通估重力 → 門檻+遲滯+不應期
  const P = { hi: 3.5, lo: 1.5, ref: 120 };
  ['Hi', 'Lo', 'Ref'].forEach((k) => {
    $('#p' + k).addEventListener('input', (e) => {
      P[k.toLowerCase()] = parseFloat(e.target.value);
      $('#v' + k).textContent = e.target.value;
    });
  });
  let shakeCount = 0, gravity = 9.8, armed = false, lastCount = 0, motionOn = false;
  const shakeTimes = []; // 每次搖動的 performance.now()，滑雪用它算頻率
  // 感測器啟用共用流程：Stage 0 的搖動關卡和滑雪都要用（iOS 權限必須手勢觸發，§9）
  async function ensureMotion() {
    if (motionOn) return true;
    const perm = await Mahou.requestMotionPermission();
    device.motionPermission = perm;
    if (perm !== 'granted') { sock.send({ type: 'deviceUpdate', device: { motionPermission: perm } }); return false; }
    startMotion();
    if (device.motionEventRateHz == null) {
      // 實測 3 秒 devicemotion 事件率 → 裝置指紋（Pixel vs 平板取樣率差異是重點）
      Mahou.measureMotionRate(3000).then((hz) => {
        device.motionEventRateHz = hz;
        sock.send({ type: 'deviceUpdate', device: { motionPermission: 'granted', motionEventRateHz: hz } });
        $('#shakeStat').innerHTML = `devicemotion 事件率：<b>${hz} Hz</b>`;
      });
    }
    return true;
  }
  // 權限按鈕一律用 click：iOS 的使用者手勢在 touchend/click 才成立，
  // 從 pointerdown 呼叫 requestPermission 會不跳窗直接回 denied（且本頁面載入內不再詢問）
  const deniedHint = 'iOS 被拒後同一頁不會再問：請「完全關閉分頁重開」再按一次；仍失敗就檢查 設定 → Safari → 動作與方向的取用';
  $('#motionBtn').addEventListener('click', async () => {
    if (!(await ensureMotion())) {
      $('#motionBtn').textContent = '權限被拒 — 關閉分頁重開再試';
      $('#shakeHint').textContent = deniedHint;
      return;
    }
    $('#motionBtn').style.display = 'none';
    $('#shakeUI').style.display = 'flex';
  });
  function startMotion() {
    if (motionOn) return;
    motionOn = true;
    window.addEventListener('devicemotion', (e) => {
      // 部分 Android 的 acceleration 回 null → 一律用 accelerationIncludingGravity
      const a = e.accelerationIncludingGravity;
      if (!a || a.x == null) return;
      const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
      gravity = gravity * 0.9 + mag * 0.1;
      const linear = mag - gravity;
      const now = performance.now();
      if (!armed && linear > P.hi) armed = true;
      if (armed && linear < P.lo && now - lastCount > P.ref) {
        shakeCount++; lastCount = now; armed = false;
        shakeTimes.push(now);
        if (shakeTimes.length > 200) shakeTimes.splice(0, 100);
        $('#shakeCount').textContent = shakeCount;
      }
    });
    // 每 300ms 上報累計數（§4 步驟 4）
    setInterval(() => {
      if (stage !== 'shake' || !joined) return;
      sock.send({ type: 'shake', count: shakeCount, params: { ...P }, tClientSend: clock.serverNow() });
    }, 300);
  }
  $('#shakeReset').addEventListener('pointerdown', () => {
    shakeCount = 0; $('#shakeCount').textContent = '0';
  });

  // ---- 木頭人・混合指令 ----
  // 所有動作都用 clock.serverNow() 蓋 client 時間戳上報，DO 依此判定 → 延遲不影響公平性
  let fz = null;
  function setupFreezeStage() {
    if (motionOn) { $('#fzPermBtn').style.display = 'none'; $('#fzUI').style.display = 'flex'; }
    else { $('#fzPermBtn').style.display = ''; $('#fzUI').style.display = 'none'; }
  }
  $('#fzPermBtn').addEventListener('click', async () => {
    if (!(await ensureMotion())) { $('#fzPermBtn').textContent = '權限被拒 — 關閉分頁重開再試'; return; }
    setupFreezeStage();
  });

  sock.on('freezeStart', () => {
    fz = { round: 0, cmd: null, green: false, sent: false, shakeBase: shakeCount, taps: 0, moved: false };
    $('#fzStat').textContent = '';
  });
  sock.on('freezeRound', (m) => {
    if (!fz) fz = {};
    Object.assign(fz, { round: m.round, cmd: m.cmd, params: m.params || {}, green: true, sent: false, shakeBase: shakeCount, taps: 0, moved: false });
    document.body.classList.remove('fzFreeze');
    renderFreezeCmd();
  });
  sock.on('freezeTurn', () => {
    if (!fz) return;
    fz.green = false;
    document.body.classList.add('fzFreeze');
    $('#fzCmd').textContent = '不要動！';
    $('#fzSub').textContent = '手機放穩，別碰螢幕';
    $('#fzArea').innerHTML = '';
  });
  sock.on('freezeEnd', (m) => {
    fz = null;
    document.body.classList.remove('fzFreeze');
    $('#fzCmd').textContent = '結束！';
    $('#fzArea').innerHTML = '';
    if (m.rank) $('#fzStat').innerHTML = m.rank.map((p, i) => `${i + 1}. ${p.name} 前進 ${p.progress}・犯規 ${p.violations}`).join('<br>');
  });
  sock.on('freezeVerdict', (m) => {
    if (m.verdict === 'ok') { $('#fzSub').textContent = '✓ 前進一格！'; navigator.vibrate?.(30); }
    else if (m.verdict === 'wrong') { $('#fzSub').textContent = '✗ 答錯了'; navigator.vibrate?.([50, 30, 50]); }
    else if (m.verdict === 'over') { $('#fzSub').textContent = '✗ 點超過了，退一格'; navigator.vibrate?.([80, 40, 80]); }
    else if (m.verdict === 'violation') { $('#fzSub').textContent = '✗ 被抓到，退一格'; navigator.vibrate?.([60, 40, 60]); }
  });

  const CMD_TEXT = {
    math: (p) => p.q + ' = ?', color: (p) => '點「' + p.name + '」！',
    tapN: (p) => '點 ' + p.n + ' 下（不能超過）', shake: (p) => '搖 ' + p.n + ' 下！', dash: () => '衝！用力連搖',
  };
  function sendAct(kind, value) {
    sock.send({ type: 'freezeAct', round: fz.round, kind, value, tClient: clock.serverNow() });
  }
  function bigBtn(text) {
    const b = document.createElement('button');
    b.id = 'fzBig'; b.textContent = text;
    return b;
  }
  function renderFreezeCmd() {
    const p = fz.params || {};
    $('#fzCmd').textContent = (CMD_TEXT[fz.cmd] || (() => ''))(p);
    $('#fzSub').textContent = '快！';
    const area = $('#fzArea');
    area.innerHTML = '';

    if (fz.cmd === 'math' || fz.cmd === 'color') {
      // 四選一：位置每回合打亂，避免記位置
      const grid = document.createElement('div');
      grid.className = 'fzColors';
      const n = (p.opts || []).length;
      const order = [...Array(n).keys()].sort(() => Math.random() - 0.5);
      for (const idx of order) {
        const b = document.createElement('button');
        if (fz.cmd === 'color') { b.style.background = p.opts[idx]; }
        else { b.style.background = '#374151'; b.style.fontSize = '2.4rem'; b.textContent = p.opts[idx]; }
        b.addEventListener('pointerdown', () => {
          if (!fz || fz.sent || !fz.green) return;
          fz.sent = true;
          b.style.outline = '5px solid #fff';
          sendAct('cmd', idx);
        });
        grid.appendChild(b);
      }
      area.appendChild(grid);
    } else if (fz.cmd === 'tapN') {
      // 連點但不能超過：到達 n 鎖定，多點一下就送 over
      const need = p.n || 4;
      const b = bigBtn('0 / ' + need);
      b.addEventListener('pointerdown', () => {
        if (!fz || !fz.green) return;
        fz.taps++;
        if (fz.taps > need) {
          if (!fz.sent) { fz.sent = true; sendAct('over', fz.taps); }
          b.textContent = '超過了！'; b.style.background = '#b91c1c';
          return;
        }
        b.textContent = fz.taps + ' / ' + need;
        b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 70);
        if (fz.taps === need && !fz.sent) { fz.sent = true; sendAct('cmd', need); }
      });
      area.appendChild(b);
    } else {
      // 搖動類：按鈕只當計數顯示，實際偵測在感測器迴圈
      const need = p.n || 3;
      const b = bigBtn('0 / ' + need);
      b.disabled = true; b.style.opacity = 1;
      area.appendChild(b);
      if (fz.cmd === 'dash') {
        const hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = '↑↓ 上下用力甩，越快越好';
        hint.style.fontSize = '1.1rem';
        area.appendChild(hint);
      }
    }
  }

  // 感測器迴圈：綠燈算搖動達標、紅燈偵測任何動作＝犯規
  setInterval(() => {
    if (!fz || stage !== 'freeze' || !joined) return;
    const need = (fz.params && fz.params.n) || (fz.cmd === 'dash' ? 8 : 3);
    if (fz.green && !fz.sent && (fz.cmd === 'shake' || fz.cmd === 'dash')) {
      const n = shakeCount - fz.shakeBase;
      const btn = document.getElementById('fzBig');
      if (btn) btn.textContent = n + ' / ' + need;
      if (n >= need) { fz.sent = true; sendAct('cmd', n); }
    }
    if (!fz.green && !fz.moved) {
      // 紅燈期間只要搖動計數又跳，就是動了
      if (shakeCount > fz.shakeBase + (fz.sent ? need : 0) + 1) { fz.moved = true; sendAct('move', 'shake'); }
    }
  }, 100);
  // 紅燈時碰螢幕也算動
  document.getElementById('st-freeze').addEventListener('pointerdown', () => {
    if (fz && !fz.green && !fz.moved) { fz.moved = true; sendAct('move', 'touch'); }
  });

  // ---- 遊戲一：顏色反應 ----
  // 大螢幕出題 → 手機四色塊（位置每局隨機打亂，防記位置）→ 點擊上報，DO 判定
  let colorCur = null, colorBlocks = [];
  sock.on('colorRound', (m) => {
    colorCur = { round: m.round, answered: false };
    colorBlocks = [];
    $('#colorMsg').textContent = `第 ${m.round} 局 — 點大螢幕上的顏色！`;
    $('#colorStat').textContent = '';
    const grid = $('#colorGrid');
    grid.innerHTML = '';
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    for (const idx of order) {
      const b = document.createElement('button');
      b.className = 'colorBlock';
      b.style.background = m.colors[idx];
      b.addEventListener('pointerdown', () => {
        if (!colorCur || colorCur.answered) return;
        colorCur.answered = true;
        b.classList.add('picked');
        const t = clock.serverNow();
        sock.send({ type: 'colorPick', round: colorCur.round, idx, tTap: t, tClientSend: t });
      });
      grid.appendChild(b);
      colorBlocks[idx] = b;
    }
  });
  sock.on('colorResult', (m) => {
    // 揭曉正解：綠框＝正確答案；點錯的話自己那塊變紅框（跨螢幕校色差異一目瞭然）
    if (colorBlocks[m.targetIdx]) colorBlocks[m.targetIdx].classList.add('isTarget');
    if (!m.correct) document.querySelector('.colorBlock.picked')?.classList.add('wrong');
    $('#colorStat').innerHTML = m.correct
      ? `✓ 答對！第 <b>${m.rank}</b> 快 · 反應 ${Math.round(m.reactionMs)}ms`
      : '✗ 點錯了，綠框才是';
  });
  sock.on('colorEnd', (m) => {
    $('#colorMsg').textContent = '遊戲結束！';
    $('#colorGrid').innerHTML = '';
    if (Array.isArray(m.scores)) {
      $('#colorStat').innerHTML = '總分：<br>' + m.scores.map((s, i) => `${i + 1}. ${s.name} — ${s.score} 分`).join('<br>');
    }
  });

  // ---- 遊戲二：滑雪下坡 ----
  // 搖動頻率(EMA α=0.3) → 速度，距離由 client 積分，每 200ms 上報（§6）
  let ski = null, skiTimer = null;
  function setupSkiStage() {
    if (motionOn) { $('#skiPermBtn').style.display = 'none'; $('#skiUI').style.display = 'flex'; }
    else { $('#skiPermBtn').style.display = ''; $('#skiUI').style.display = 'none'; }
  }
  $('#skiPermBtn').addEventListener('click', async () => {
    if (!(await ensureMotion())) {
      $('#skiPermBtn').textContent = '權限被拒 — 關閉分頁重開再試';
      $('#skiMsg').textContent = deniedHint;
      $('#skiUI').style.display = 'flex';
      return;
    }
    setupSkiStage();
  });
  sock.on('skiStart', (m) => {
    ski = { startAt: m.startAt, duration: m.duration, dist: 0, ema: 0, speedNow: 0, done: false, tick: 0 };
    $('#skiDist').textContent = '0';
    $('#skiStat').textContent = '';
    clearInterval(skiTimer);
    skiTimer = setInterval(skiTick, 100);
    startSkiView();
  });

  // 手機端第一人稱視覺：滑雪者固定在下方，樹迎面刷過，速度感由捲動速率與速度線呈現
  let skiWorld = 0, skiViewOn = false;
  function startSkiView() {
    if (skiViewOn) return;
    skiViewOn = true;
    const cv = $('#skiView');
    const loop = () => {
      if (!ski || (ski.done && skiViewOn)) { skiViewOn = false; return; }
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const W = cv.clientWidth * dpr, H = cv.clientHeight * dpr;
      if (cv.width !== W) { cv.width = W; cv.height = H; }
      const ctx = cv.getContext('2d');
      const sp = ski.speedNow || 0;
      skiWorld += sp * dpr * 1.1; // 速度→捲動
      ctx.fillStyle = '#eaf3fb'; ctx.fillRect(0, 0, W, H);
      // 速度線（快的時候才出現）
      if (sp > 4) {
        ctx.strokeStyle = 'rgba(120,160,200,' + Math.min((sp - 4) / 10, 0.5) + ')';
        ctx.lineWidth = 2 * dpr;
        for (let i = 0; i < 6; i++) {
          const x = ((i * 173 + 37) % W);
          const y = (skiWorld * 2.2 + i * 331) % (H + 60) - 30;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 22 * dpr); ctx.stroke();
        }
      }
      // 樹：固定世界間距，回收時換 x 位置
      ctx.font = 30 * dpr + 'px serif';
      const gap = 90 * dpr, span = H + gap * 2;
      for (let i = 0; i < Math.ceil(span / gap); i++) {
        const wy = i * gap;
        const cycle = Math.floor((skiWorld + wy) / span);
        const sy = (skiWorld + wy) % span - gap;
        const r = Math.abs(Math.sin(i * 7919 + cycle * 104729));
        ctx.fillText('🌲', 10 + r * (W - 50), sy);
      }
      // 滑雪者固定下方，隨速度左右擺
      const sway = Math.sin(performance.now() / 160) * Math.min(sp, 8) * 2 * dpr;
      ctx.font = 40 * dpr + 'px serif';
      ctx.fillText('⛷️', W / 2 - 20 * dpr + sway, H - 14 * dpr);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  function skiTick() {
    if (!ski) return;
    const now = clock.serverNow() ?? Date.now();
    if (now < ski.startAt) {
      $('#skiMsg').textContent = `準備… ${Math.ceil((ski.startAt - now) / 1000)}`;
      return;
    }
    const remain = ski.startAt + ski.duration - now;
    if (remain <= 0) {
      if (!ski.done) {
        ski.done = true;
        sock.send({ type: 'skiDone', distance: Math.round(ski.dist * 10) / 10 });
        $('#skiMsg').textContent = '結束！';
        $('#skiStat').innerHTML = `你滑了 <b>${ski.dist.toFixed(1)} m</b>`;
        $('#skiSpeedBar').style.width = '0%';
        clearInterval(skiTimer);
      }
      return;
    }
    $('#skiMsg').textContent = `剩 ${Math.ceil(remain / 1000)} 秒`;
    // 最近 1 秒的搖動次數 → EMA
    const t = performance.now();
    let n = 0;
    for (let i = shakeTimes.length - 1; i >= 0 && shakeTimes[i] > t - 1000; i--) n++;
    ski.ema = 0.3 * n + 0.7 * ski.ema;
    // 封頂 12：第一輪實測 10 太容易貼頂（27/30 秒滿速），抹平了玩家差距
    const speed = Math.min(ski.ema * 1.6, 12);
    ski.speedNow = speed;
    ski.dist += speed * 0.1;
    $('#skiDist').textContent = ski.dist.toFixed(0);
    $('#skiSpeedBar').style.width = (speed / 12) * 100 + '%';
    if (++ski.tick % 2 === 0) {
      sock.send({ type: 'skiRun', speed: Math.round(speed * 100) / 100, distance: Math.round(ski.dist * 10) / 10, shakeRate: Math.round(ski.ema * 10) / 10, tClientSend: clock.serverNow() });
    }
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木頭人 — 美術原型</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; background: #101014; color: #e8e6e0; padding: 16px; }
  .wrap { max-width: 1160px; margin: 0 auto; }
  h1 { font-size: 1rem; color: #97928a; font-weight: 600; margin-bottom: 10px; }
  #stage { background: #000; border-radius: 8px; overflow: hidden; line-height: 0; border: 1px solid #26262e; }
  canvas { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .readout { margin-top: 10px; font-family: ui-monospace, monospace; font-size: .8rem; color: #8b877e; display: flex; gap: 18px; flex-wrap: wrap; }
  .readout b { color: #e8c98a; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
<h1>#1 木頭人・混合指令 — 大螢幕美術原型（384×216 → 整數放大）</h1>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="readout">
  <span>背景重繪 <b id="mBg">–</b>（一次性，快取）</span>
  <span>每幀 <b id="mFrame">–</b></span>
  <span>循環：綠燈 3.5s 前進 → 紅燈 2.5s 定格（有人手滑就抓）</span>
</div>
</div>
<script>
(function () {
  const W = 384, H = 216;
  const cv = document.getElementById('cv');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // ---------- 調色盤（風格聖經：場景受限取色）----------
  const PAL = {
    sky1: '#4a90d9', sky2: '#63a5e4', sky3: '#8ec3ef', cloud: '#f4f8fc', cloudS: '#c9dff2',
    tree1: '#2e6b34', tree2: '#3d8544', wheat1: '#d9a83f', wheat2: '#c1912f', wheatHi: '#e8c060',
    grass: '#5d9a4a', fence: '#6b4a2e',
    road1: '#c49a62', road2: '#b3894f', road3: '#a07a42', roadLine: '#8f6c38',
    hud: '#16161d', hudEdge: '#3a3a46', hudEdge2: '#57575f',
    red: '#e03c2e', green: '#4fc75a', yellow: '#f2c14e', white: '#f2f2ee', grey: '#9a9aa4',
  };
  const hx = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgbs = (c) => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  const shade = (h, amt) => {
    const c = hx(h);
    return rgbs(amt < 0
      ? [c[0] * (1 + amt), c[1] * (1 + amt * .88), c[2] * (1 + amt * .62)]
      : [c[0] + (255 - c[0]) * amt, c[1] + (255 - c[1]) * amt * .92, c[2] + (255 - c[2]) * amt * .6]);
  };
  const B4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const bayer = (x, y) => (B4[y & 3][x & 3] + .5) / 16;
  const ss = (t) => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  const punch = (v, k) => ss((v - 0.5) * (k || 3) + 0.5);
  const hash = (i) => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };

  // ---------- 精靈繪製 ----------
  function sprite(c, rows, pal, x, y, s) {
    s = s || 1;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let i = 0; i < row.length; i++) {
        const k = row[i];
        if (k === '.' || !pal[k]) continue;
        c.fillStyle = pal[k];
        c.fillRect(x + i * s, y + r * s, s, s);
      }
    }
  }

  // 小孩背影 16×20，兩幀走路（腿互換）。o=描邊 h=頭髮 k=皮膚 s=上衣 p=褲 e=鞋 c=帽
  const KID_A = [
    '.....oooooo.....',
    '....ohhhhhho....',
    '...ohhhhhhhho...',
    '...ohhhhhhhho...',
    '...ohhhhhhhho...',
    '....ohhhhhho....',
    '.....okkkko.....',
    '...oossssssoo...',
    '..osssssssssso..',
    '..osssssssssso..',
    '.oksssssssssko..',
    '.oksssssssssko..',
    '..o.ssssssss.o..',
    '....oppppppo....',
    '...oppppppppo...',
    '...opp.oo.ppo...',
    '...okk.oo.kko...',
    '...okk....kko...',
    '...oee....eeo...',
    '................',
  ];
  const KID_B = KID_A.map((r, i) => (i >= 15 && i <= 18) ? r.split('').reverse().join('') : r);
  // 裙裝變體：下半改 A 字裙
  const KID_DRESS = KID_A.slice(0, 13).concat([
    '....osssssso....',
    '...ossssssssso..',
    '..osssssssssso..',
    '...okk....kko...',
    '...okk....kko...',
    '...oee....eeo...',
    '................',
  ]);
  // 棒球帽變體：頭頂三列換帽色
  const KID_CAP = KID_A.map((r, i) => (i >= 1 && i <= 3) ? r.replace(/h/g, 'c') : r);

  const OUT = '#241a12', SKIN = '#f0c090', SKIN2 = '#d9a878';
  const KIDS = [
    { rows: [KID_A, KID_B], hair: '#2a2320', shirt: '#e07a2e', pants: '#3d5a8a', lane: .40, z: .30 },
    { rows: [KID_A, KID_B], hair: '#4a3020', shirt: '#5a8a3d', pants: '#6b4a2e', lane: .52, z: .28 },
    { rows: [KID_A, KID_B], hair: '#20242a', shirt: '#d94040', pants: '#3a4a6b', lane: .64, z: .31 },
    { rows: [KID_DRESS, KID_DRESS], hair: '#3d2a1a', shirt: '#c9569a', pants: '#c9569a', lane: .74, z: .50 },
    { rows: [KID_A, KID_B], hair: '#c9a050', shirt: '#3d7ac9', pants: '#2e5a3d', lane: .86, z: .35 },
    { rows: [KID_CAP, KID_CAP], hair: '#2a2320', shirt: '#4a9a5d', pants: '#3d5a8a', cap: '#2e7a3d', lane: .28, z: .55 },
    { rows: [KID_A, KID_B], hair: '#3a2e22', shirt: '#e0b83d', pants: '#5a6b3d', lane: .52, z: .58 },
    { rows: [KID_A, KID_B], hair: '#57402a', shirt: '#9a4ac9', pants: '#3a3a4a', lane: .16, z: .33 },
  ];
  KIDS.forEach((k) => { k.prog = 0; k.caught = 0; });

  // 紅衣娃娃 24×40：背面 / 正面
  const DOLL_BACK = [
    '......oo..oo......',
    '..oo.ohho.ohho.oo.',
    '.orro.ohhhhho.orro',
    '..oo.ohhhhhhho.oo.',
    '.....ohhhhhhho....',
    '.....ohhhhhhho....',
    '......ohhhhho.....',
    '.....yyyyyyyyy....',
    '....yyorrrroyy....',
    '....yyorrrroyy....',
    '.....orrrrrro.....',
    '.....orrrrrro.....',
    '....orrrrrrrro....',
    '....orrrrrrrro....',
    '...orrrrrrrrrro...',
    '...orrrrrrrrrro...',
    '..orrrrrrrrrrrro..',
    '..orrrrrrrrrrrro..',
    '.....ww....ww.....',
    '.....ww....ww.....',
    '.....oo....oo.....',
  ];
  const DOLL_FRONT = DOLL_BACK.map((r, i) => {
    if (i === 4) return '.....okfffko......'.padEnd(18, '.');
    if (i === 5) return '.....offfffo......'.padEnd(18, '.');
    if (i === 6) return '......offfo.......'.padEnd(18, '.');
    return r;
  });
  const dollPal = (front) => ({
    o: OUT, h: '#2a1e14', r: '#e03c2e', y: '#f2c14e', w: '#f2f2ee',
    f: SKIN, k: front ? '#e03c2e' : SKIN,
  });

  // ---------- 背景（畫一次快取）----------
  const HUD_TOP = 34, HORIZON = 78;
  const VPX = W / 2;                       // 消失點
  let bgCv = null;
  function buildBg() {
    const t0 = performance.now();
    bgCv = document.createElement('canvas'); bgCv.width = W; bgCv.height = H;
    const c = bgCv.getContext('2d', { alpha: false });
    // 天空三段 + punch 抖動過渡
    for (let y = 0; y < HORIZON; y++) {
      for (let x = 0; x < W; x++) {
        const t = y / HORIZON;
        let col = PAL.sky1;
        if (punch(t * 1.6 - 0.15, 2.4) > bayer(x, y)) col = PAL.sky2;
        if (punch(t * 1.6 - 0.75, 2.4) > bayer(x, y)) col = PAL.sky3;
        c.fillStyle = col; c.fillRect(x, y, 1, 1);
      }
    }
    // 雲：橢圓群 + 平底 + 淡藍底影
    const cloud = (cx, cy, s) => {
      c.fillStyle = PAL.cloudS;
      for (const [dx, dy, r] of [[-14, 2, 9], [0, 0, 12], [14, 3, 8]]) blob(cx + dx * s, cy + dy * s + 2, r * s);
      c.fillStyle = PAL.cloud;
      for (const [dx, dy, r] of [[-14, 2, 9], [0, 0, 12], [14, 3, 8], [6, -5, 7]]) blob(cx + dx * s, cy + dy * s, r * s);
      c.fillStyle = PAL.cloud; c.fillRect(cx - 15 * s, cy + 4 * s, 30 * s, 3 * s);   // 平底
    };
    function blob(cx, cy, r) {
      for (let y = -r; y <= r; y++) for (let x = -r * 1.3; x <= r * 1.3; x++)
        if ((x / 1.3) * (x / 1.3) + y * y <= r * r) c.fillRect(cx + x, cy + y, 1, 1);
    }
    cloud(60, HUD_TOP + 16, .8); cloud(300, HUD_TOP + 12, 1); cloud(190, HUD_TOP + 22, .55); cloud(360, HUD_TOP + 26, .6);
    // 樹牆：兩層扇形輪廓
    for (const [yo, col] of [[0, PAL.tree1], [3, PAL.tree2]]) {
      c.fillStyle = col;
      for (let x = 0; x < W; x += 3) {
        const h2 = 8 + Math.abs(Math.sin(x * .21 + yo)) * 5 + Math.abs(Math.sin(x * .05)) * 3 - yo;
        c.fillRect(x, HORIZON - h2, 3, h2);
      }
    }
    // 地面基底：草
    c.fillStyle = PAL.grass; c.fillRect(0, HORIZON, W, H - HORIZON);
    // 麥田（路兩側，透視收斂）：先畫大梯形再加垂直筆觸
    const roadHalf = (y) => 6 + (y - HORIZON) * 1.55;         // 路半寬隨 y 擴大
    for (let y = HORIZON; y < H; y++) {
      const rh = roadHalf(y);
      const wheatIn = rh + 4 + (y - HORIZON) * .35;           // 麥田內緣
      for (let x = 0; x < W; x++) {
        const d = Math.abs(x - VPX);
        if (d < rh) {                                          // 路面
          const t = (y - HORIZON) / (H - HORIZON);
          let col = PAL.road2;
          if (punch(1 - t * 1.3, 2) > bayer(x, y)) col = PAL.road1;
          if (d > rh - 2.5) col = PAL.road3;                   // 路緣
          c.fillStyle = col;
        } else if (d < wheatIn) {                              // 路肩草
          c.fillStyle = ((x + y) & 3) ? PAL.grass : shade(PAL.grass, -.12);
        } else {                                               // 麥田
          const n = hash(x * 7 + (y >> 1) * 131);
          c.fillStyle = n > .82 ? PAL.wheatHi : (n > .38 ? PAL.wheat1 : PAL.wheat2);
        }
        c.fillRect(x, y, 1, 1);
      }
    }
    // 路面透視線（往消失點收斂）＋ 橫向车轍（按 z 間距）
    c.fillStyle = PAL.roadLine;
    for (const fx of [-.62, -.22, .22, .62]) {
      for (let y = HORIZON + 3; y < H; y++) {
        const x = VPX + roadHalf(y) * fx;
        if (((y + (fx > 0 ? 1 : 0)) & 2) === 0) c.fillRect(x, y, 1, 1);   // 虛線感
      }
    }
    for (let i = 1; i < 14; i++) {
      const z = 90 / i, y = HORIZON + z;                      // z = f/(y-horizon) 的反用
      if (y > H - 4 || y < HORIZON + 4) continue;
      c.fillStyle = shade(PAL.road3, -.08);
      c.fillRect(VPX - roadHalf(y) + 2, y, roadHalf(y) * 2 - 4, 1);
    }
    // 圍籬：兩側柱子＋橫桿（跟著透視縮小）
    for (const side of [-1, 1]) {
      let py = HORIZON + 6;
      for (let i = 0; i < 7; i++) {
        const rh = roadHalf(py), x = VPX + side * (rh + 3 + (py - HORIZON) * .34);
        const ph = 3 + (py - HORIZON) * .16;
        c.fillStyle = PAL.fence; c.fillRect(x - 1, py - ph, 2, ph);
        c.fillStyle = shade(PAL.fence, .18); c.fillRect(x - 1, py - ph, 2, 1);
        py += 6 + (py - HORIZON) * .55;
      }
    }
    // 路邊告示牌（左綠右紅的空板，字每幀畫）
    for (const side of [-1, 1]) {
      const x = VPX + side * 118, y = HORIZON + 8;
      c.fillStyle = PAL.hudEdge; c.fillRect(x - 2, y + 18, 4, 16);           // 柱
      panel(c, x - 34, y - 10, 68, 28);
    }
    // HUD 框（頂條、角板、計分板——文字動態畫）
    c.fillStyle = PAL.hud; c.fillRect(0, 0, W, HUD_TOP);
    c.fillStyle = PAL.hudEdge; c.fillRect(0, HUD_TOP - 2, W, 2);
    panel(c, 4, 4, 52, 26); panel(c, W - 56, 4, 52, 26); panel(c, W / 2 - 62, 3, 124, 28);
    panel(c, 4, H - 34, 66, 30);                                             // 左下 1P
    panel(c, W - 96, H - 58, 92, 54);                                        // 右下計分板
    document.getElementById('mBg').textContent = (performance.now() - t0).toFixed(1) + ' ms';
  }
  function panel(c, x, y, w, h) {
    c.fillStyle = PAL.hudEdge2; c.fillRect(x - 1, y - 1, w + 2, h + 2);
    c.fillStyle = PAL.hudEdge; c.fillRect(x, y, w, h);
    c.fillStyle = PAL.hud; c.fillRect(x + 2, y + 2, w - 4, h - 4);
  }

  // ---------- 主迴圈 ----------
  // 循環：綠燈 3.5s（前進）→ 紅燈 2.5s（定格，開頭 0.4s 內還在動的算違規）
  const CYCLE = 6, GREEN_T = 3.5;
  let frameCost = [], round = 1, lastCyc = 0;
  function loop(now) {
    const t0 = performance.now(), t = now / 1000;
    const cyc = t % CYCLE, green = cyc < GREEN_T;
    if (cyc < lastCyc) { round = (round % 10) + 1; KIDS.forEach((k) => { k.caught = 0; }); }
    lastCyc = cyc;
    ctx.drawImage(bgCv, 0, 0);

    // 告示牌文字：兩塊都在，亮的那塊是當前狀態
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px "Noto Sans TC",sans-serif';
    ctx.fillStyle = green ? PAL.green : shade(PAL.green, -.55);
    ctx.fillText('綠燈！', VPX - 118, HORIZON + 3);
    ctx.fillStyle = !green ? PAL.red : shade(PAL.red, -.55);
    ctx.fillText('紅燈！', VPX + 118, HORIZON + 3);

    // 小孩：綠燈前進（走路兩幀＋上下顛），紅燈定格；違規演出：3 號小孩每輪紅燈開頭多動 0.3s
    KIDS.forEach((k, i) => {
      if (green) k.prog = (k.prog + 0.016 * (0.7 + hash(i + round) * .6)) % 1;
      const late = !green && i === (round % KIDS.length) && cyc < GREEN_T + 0.55;
      if (late) { k.prog += 0.012; k.caught = 1; }
      const sc = k.z >= 0.45 ? 2 : 1;                            // 近排 2x（整數倍）
      const y = HORIZON + 16 + k.z * 96 - k.prog * 10;           // 前進=往娃娃靠近一點點
      const x = VPX + (k.lane - 0.5) * (2 * (6 + (y - HORIZON) * 1.55)) * 0.84;
      const walking = green || late;
      const frame = walking ? (Math.floor(t * 6 + i) % 2) : 0;
      const bob = walking ? (Math.floor(t * 6 + i) % 2) * sc : 0;
      const pal = { o: OUT, h: k.hair, k: SKIN, s: k.shirt, p: k.pants, e: '#2a2320', c: k.cap || k.hair };
      ctx.fillStyle = 'rgba(60,40,20,.30)';
      ctx.fillRect(x - 6 * sc, y + 19 * sc, 13 * sc, 2 * sc);
      sprite(ctx, k.rows[frame], pal, x - 8 * sc, y - bob, sc);
      if (k.caught) {                                            // 抓到：紅 ✗ + 紅框閃
        ctx.font = 'bold ' + (9 * sc) + 'px sans-serif'; ctx.fillStyle = PAL.red;
        ctx.fillText('✗', x, y - 6 * sc);
        if (Math.floor(t * 6) % 2) { ctx.strokeStyle = PAL.red; ctx.lineWidth = 1; ctx.strokeRect(x - 9.5 * sc, y - 2.5, 19 * sc, 23 * sc); }
      }
    });

    // 娃娃：綠燈背對、紅燈轉身（用 0.18s 的壓縮寬度模擬轉身）
    const turnT = green ? Math.max(0, 1 - (cyc) / .18) : Math.min(1, (cyc - GREEN_T) / .18);
    const rows = turnT > 0.5 ? DOLL_FRONT : DOLL_BACK;
    const squash = Math.abs(turnT - 0.5) * 2;                    // 0.5 時最窄
    const dw = Math.max(0.2, squash), dx0 = VPX - 18 * dw * 2 / 2;
    ctx.save();
    ctx.translate(VPX, 0); ctx.scale(dw, 1); ctx.translate(-VPX, 0);
    sprite(ctx, rows, dollPal(turnT > 0.5), VPX - 18, HORIZON - 34, 2);
    ctx.restore();
    ctx.fillStyle = 'rgba(60,40,20,.35)'; ctx.fillRect(VPX - 16, HORIZON + 8, 32, 3);

    // ---- HUD 動態文字 ----
    ctx.font = 'bold 8px "IBM Plex Mono",ui-monospace,monospace';
    ctx.fillStyle = PAL.grey; ctx.fillText('ROUND', 30, 11); ctx.fillText('TIME', W - 30, 11);
    ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.fillStyle = PAL.yellow; ctx.fillText(String(round).padStart(2, '0'), 30, 23);
    const remain = 25 - Math.floor(t % 25);
    ctx.fillStyle = remain <= 5 ? PAL.red : PAL.white;
    ctx.fillText('00:' + String(remain).padStart(2, '0'), W - 30, 23);
    // 中央横幅 + 進度條
    ctx.font = 'bold 16px "Noto Sans TC",sans-serif';
    ctx.fillStyle = green ? PAL.green : PAL.red;
    ctx.fillText(green ? '綠燈！' : '紅燈！', W / 2, 14);
    const pr = green ? 1 - cyc / GREEN_T : 1 - (cyc - GREEN_T) / (CYCLE - GREEN_T);
    ctx.fillStyle = PAL.hudEdge2; ctx.fillRect(W / 2 - 54, 23, 108, 4);
    ctx.fillStyle = green ? PAL.green : PAL.red; ctx.fillRect(W / 2 - 54, 23, 108 * pr, 4);
    // 左下 1P 板
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.red; ctx.fillRect(9, H - 29, 14, 9);
    ctx.font = 'bold 7px ui-monospace,monospace'; ctx.fillStyle = PAL.white; ctx.fillText('1P', 11, H - 24);
    ctx.font = 'bold 8px "Noto Sans TC",sans-serif'; ctx.fillText('玩家1', 27, H - 24);
    ctx.font = 'bold 9px ui-monospace,monospace'; ctx.fillText('00' + (300 - round * 10), 10, H - 11);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < 2 ? PAL.red : shade(PAL.red, -.5); ctx.fillRect(44 + i * 8, H - 16, 6, 6); }
    // 右下計分板
    const tags = [PAL.red, PAL.green, '#3d7ac9', PAL.yellow];
    for (let i = 0; i < 4; i++) {
      const y = H - 52 + i * 12;
      ctx.fillStyle = tags[i]; ctx.fillRect(W - 91, y, 13, 9);
      ctx.font = 'bold 7px ui-monospace,monospace'; ctx.fillStyle = i === 3 ? '#2a2320' : PAL.white;
      ctx.fillText((i + 1) + 'P', W - 89, y + 5);
      ctx.font = 'bold 8px "Noto Sans TC",sans-serif'; ctx.fillStyle = PAL.white;
      ctx.fillText('玩家' + (i + 1), W - 74, y + 5);
      ctx.font = 'bold 8px ui-monospace,monospace'; ctx.fillStyle = PAL.grey;
      ctx.fillText(String((4 - i) * 120 - round * 7).padStart(5, '0'), W - 36, y + 5);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

    frameCost.push(performance.now() - t0);
    if (frameCost.length > 60) {
      frameCost.sort((a, b) => a - b);
      document.getElementById('mFrame').textContent = frameCost[30].toFixed(2) + ' ms';
      frameCost = [];
    }
    requestAnimationFrame(loop);
  }
  buildBg();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

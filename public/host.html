<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主控台 — 家宴 POC</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #0b1120; color: #f1f5f9; padding: 20px; }
  h1 { font-size: 1.3rem; margin-bottom: 12px; color: #94a3b8; }
  .top { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 16px; }
  .roomcode { font-size: 4rem; font-weight: 900; letter-spacing: .15em; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; }
  .url { color: #64748b; font-size: .85rem; word-break: break-all; max-width: 300px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button { font-size: 1rem; padding: 10px 18px; border-radius: 10px; border: none; background: #1e293b; color: #f1f5f9; cursor: pointer; font-weight: 600; }
  button.active { background: #2563eb; }
  button.export { background: #059669; margin-left: auto; }
  button:disabled { opacity: .35; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #1e293b; font-variant-numeric: tabular-nums; }
  th { color: #64748b; font-size: .8rem; font-weight: 600; }
  td.good { color: #4ade80; } td.warn { color: #facc15; } td.bad { color: #f87171; }
  tr.flash td { background: #14532d; transition: background .05s; }
  tr td { transition: background .6s; }
  .offline { opacity: .35; }
  .panel { background: #111a2e; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .panel h2 { font-size: .9rem; color: #64748b; margin-bottom: 8px; }
  #feed { font-size: .8rem; color: #94a3b8; max-height: 180px; overflow-y: auto; font-family: ui-monospace, monospace; line-height: 1.6; }
  #summary { font-size: .9rem; line-height: 1.9; }
  #summary b { color: #7dd3fc; }
</style>
</head>
<body>
<h1>家宴多人互動 POC — 主控台 <span id="connState"></span></h1>

<div class="top">
  <div>
    <div class="roomcode" id="roomCode">····</div>
    <div class="url" id="clientUrl"></div>
  </div>
  <div id="qr"></div>
</div>

<div class="controls">
  <button data-stage="lobby" class="active">大廳</button>
  <button data-stage="ping">② Ping 測試</button>
  <button data-stage="tap-single">③ 單點×10</button>
  <button data-stage="tap-spam">③ 狂點 3 秒</button>
  <button data-stage="shake">④ 搖動計數</button>
  <button data-stage="freeze">🚦 木頭人</button>
  <button data-stage="color">🎨 顏色反應</button>
  <button data-stage="ski">⛷️ 滑雪下坡</button>
  <select id="hintSel" title="DO 區域（換區域會開新房）" style="font-size:1rem;padding:10px;border-radius:10px;background:#1e293b;color:#f1f5f9;border:none">
    <option value="wnam">DO區域：美西 wnam</option>
    <option value="apac">DO區域：亞太 apac</option>
    <option value="weur">DO區域：西歐 weur</option>
  </select>
  <button class="export" id="exportBtn">匯出 JSON</button>
  <button id="endBtn" style="background:#7f1d1d">結束房間</button>
</div>

<table>
  <thead><tr>
    <th>暱稱</th><th>裝置</th><th>motion Hz</th><th>RTT min/p50/p95</th><th>對時掉包</th><th>漂移</th>
    <th>單點上行 p50/p95</th><th>狂點掉包</th><th>搖動</th>
  </tr></thead>
  <tbody id="roster"></tbody>
</table>

<div class="panel" id="freezePanel" style="display:none">
  <h2>木頭人・混合指令 — 10 回合，判定用 client 時間戳（延遲免疫）</h2>
  <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px">
    <button id="freezeStartBtn" style="background:#2563eb">開始 10 回合</button>
    <span id="freezeInfo" style="color:#94a3b8; font-size:.9rem"></span>
  </div>
  <canvas id="freezeCv" width="384" height="216" style="width:100%; image-rendering:pixelated; border-radius:10px; background:#0b1120"></canvas>
  <div id="freezeRank" style="margin-top:8px; font-size:.95rem"></div>
</div>

<div class="panel" id="colorPanel" style="display:none">
  <h2>遊戲一：顏色反應 — 20 局，ΔE 100 → 40 → 15 → 7</h2>
  <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start">
    <div>
      <div id="targetSwatch" style="width:320px; height:220px; border-radius:14px; background:#1e293b; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:1.4rem">按「開始」</div>
      <div id="colorRoundInfo" style="margin-top:10px; font-size:.9rem; color:#94a3b8"></div>
      <button id="colorStartBtn" style="background:#2563eb; margin-top:10px">開始 20 局</button>
    </div>
    <div style="flex:1; min-width:280px">
      <table style="margin:0"><thead><tr><th>玩家</th><th>本局</th><th>反應</th><th>總分</th></tr></thead><tbody id="colorBoard"></tbody></table>
    </div>
  </div>
</div>

<div class="panel" id="skiPanel" style="display:none">
  <h2>遊戲二：滑雪下坡 — 30 秒 <span id="skiTimerLbl" style="color:#7dd3fc"></span></h2>
  <button id="skiStartBtn" style="background:#2563eb; margin-bottom:10px">開始</button>
  <canvas id="skiCanvas" width="960" height="430" style="width:100%; border-radius:10px; background:#eaf3fb"></canvas>
  <div id="skiResults" style="margin-top:8px; font-size:.95rem"></div>
</div>

<div class="panel"><h2>即席摘要（正式數據以匯出 JSON 為準）</h2><div id="summary">還沒有數據。</div></div>
<div class="panel"><h2>事件流</h2><div id="feed"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/shared.js"></script>
<script>
(function () {
  const { $ } = Mahou;

  // 房號放在 hash：重新整理房間不變，也可手動指定 /host.html#ABCD
  let roomId = (location.hash.slice(1) || '').toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(roomId)) {
    roomId = Mahou.randomRoom();
    location.hash = roomId;
  }
  $('#roomCode').textContent = roomId;
  const clientUrl = `${location.origin}/client#${roomId}`;
  $('#clientUrl').textContent = clientUrl;
  try {
    // CDN 掛掉不能讓主控台跟著死：降級成純文字網址（上面已顯示）
    new QRCode(document.getElementById('qr'), { text: clientUrl, width: 200, height: 200 });
  } catch (e) {
    document.getElementById('qr').textContent = 'QR 產生失敗，請手動輸入上方網址';
  }

  Mahou.keepAwake();

  // DO 區域 A/B：hint 只在房間第一次建立時生效，換區域一律開新房
  const hint = new URLSearchParams(location.search).get('hint') || 'wnam';
  $('#hintSel').value = ['wnam', 'apac', 'weur'].includes(hint) ? hint : 'wnam';
  $('#hintSel').addEventListener('change', (e) => {
    location.href = `${location.pathname}?hint=${e.target.value}#${Mahou.randomRoom()}`;
  });

  const sock = new Mahou.Sock(roomId, 'host', `&hint=${encodeURIComponent(hint)}`);
  sock.onOpen(() => { $('#connState').textContent = '🟢' + ($('#connState').dataset.colo || ''); });
  sock.ws.addEventListener('close', () => { $('#connState').textContent = '🔴'; });
  // DO 落點診斷：doColo 離現場越遠，RTT 地板越高
  fetch(`/whereami/${roomId}?hint=${encodeURIComponent(hint)}`).then((r) => r.json()).then((w) => {
    $('#connState').dataset.colo = ` DO@${w.doColo}·邊緣@${w.edgeColo}`;
    $('#connState').textContent += $('#connState').dataset.colo;
  }).catch(() => {});

  // ---- per-client 即席統計（host 端自己累積，正式數據看匯出檔） ----
  const stats = new Map(); // clientId -> {uplinks:[], spam:{}, shake:0, shakeUplink:null}
  const stat = (id) => {
    if (!stats.has(id)) stats.set(id, { uplinks: [], spam: null, shake: 0, shakeUplink: null });
    return stats.get(id);
  };

  let roster = [];
  sock.on('roster', (m) => { roster = m.clients; renderRoster(); });
  sock.on('syncUpdate', (m) => {
    const c = roster.find((x) => x.clientId === m.clientId);
    if (c) c.sync = { offset: m.offset, rtt: m.rtt, drift: m.drift };
    renderRoster();
  });
  sock.on('tapEvent', (m) => {
    if (m.uplinkMs != null && m.mode === 'single') stat(m.clientId).uplinks.push(m.uplinkMs);
    feed(`${m.name} 點擊 #${m.seq} (${m.mode}) 上行 ${m.uplinkMs?.toFixed(1) ?? '?'}ms`);
    flashRow(m.clientId);
    renderRoster(); renderSummary();
  });
  sock.on('spamSummary', (m) => {
    stat(m.clientId).spam = m;
    feed(`${m.name} 狂點結束：送 ${m.sent} 收 ${m.received} 斷號 ${m.gaps} 掉包 ${m.lossPct}%`);
    renderRoster(); renderSummary();
  });
  sock.on('shakeEvent', (m) => {
    const s = stat(m.clientId);
    s.shake = m.count; s.shakeUplink = m.uplinkMs; s.shakeParams = m.params;
    renderRoster();
  });
  sock.on('stage', (m) => setActiveBtn(m.stage));

  // ---- 關卡控制 ----
  document.querySelectorAll('button[data-stage]').forEach((btn) => {
    btn.addEventListener('click', () => {
      sock.send({ type: 'stage', stage: btn.dataset.stage });
      setActiveBtn(btn.dataset.stage);
    });
  });
  function setActiveBtn(stage) {
    document.querySelectorAll('button[data-stage]').forEach((b) =>
      b.classList.toggle('active', b.dataset.stage === stage));
    $('#freezePanel').style.display = stage === 'freeze' ? '' : 'none';
    $('#colorPanel').style.display = stage === 'color' ? '' : 'none';
    $('#skiPanel').style.display = stage === 'ski' ? '' : 'none';
  }

  // host 也需要伺服器時鐘（滑雪倒數對齊用）
  const hostClock = new Mahou.ClockSync(sock);
  sock.onOpen(() => hostClock.sync(6));

  // ================= 木頭人・混合指令 =================
  // host 只負責節奏（出指令、喊轉身），所有判定在 DO 用 client 時間戳做
  const CMDS = [
    { key: 'shake', label: '搖 3 下！', color: '#f2c14e' },
    { key: 'tapRed', label: '點紅色！', color: '#e8604c' },
    { key: 'spam', label: '狂點 5 下！', color: '#4fb36b' },
    { key: 'dash', label: '衝！', color: '#38bdf8' },
  ];
  const FZ = { running: false, round: 0, cmd: null, green: false, players: [], phaseEnd: 0, phaseLen: 1 };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  $('#freezeStartBtn').addEventListener('click', async () => {
    if (FZ.running) return;
    sock.send({ type: 'stage', stage: 'freeze' });
    setActiveBtn('freeze');
    FZ.running = true; FZ.players = []; $('#freezeRank').textContent = '';
    sock.send({ type: 'freezeStart' });
    await sleep(600);
    for (let r = 1; r <= 10 && FZ.running; r++) {
      const cmd = CMDS[Math.floor(Math.random() * CMDS.length)];
      const greenMs = 2400 + Math.random() * 2000;
      sock.send({ type: 'freezeRound', cmd: cmd.key });
      FZ.round = r; FZ.cmd = cmd; FZ.green = true;
      FZ.phaseEnd = performance.now() + greenMs; FZ.phaseLen = greenMs;
      await sleep(greenMs);
      if (!FZ.running) break;
      const redMs = 1800 + Math.random() * 1400;
      sock.send({ type: 'freezeTurn' });
      FZ.green = false;
      FZ.phaseEnd = performance.now() + redMs; FZ.phaseLen = redMs;
      await sleep(redMs);
    }
    sock.send({ type: 'freezeEnd' });
    FZ.running = false; FZ.cmd = null;
  });

  sock.on('freezeState', (m) => { FZ.players = m.players; });
  sock.on('freezeEnd', (m) => {
    FZ.running = false;
    $('#freezeRank').innerHTML = '🏁 ' + (m.rank || []).map((p, i) =>
      `${i + 1}. <b>${esc(p.name)}</b> 前進 ${p.progress}・犯規 ${p.violations}`).join(' · ');
  });

  // 簡單小人（提案版的 7×9），換調色盤＝換人
  const PERSON = ['..hhh..', '.hhhhh.', '.hfffh.', '..fff..', '.bbbbb.', 'bbbbbbb', '.bbbbb.', '..b.b..', '..s.s..'];
  const PERSON_BACK = ['..hhh..', '.hhhhh.', '.hhhhh.', '..hhh..', '.bbbbb.', 'bbbbbbb', '.bbbbb.', '..b.b..', '..s.s..'];
  const SKIN = '#f0c090';
  const PALS = [
    { h: '#3b2a1f', f: SKIN, b: '#d94f4f', s: '#3a3a4a' }, { h: '#1f1a2e', f: SKIN, b: '#4f86d9', s: '#3a3a4a' },
    { h: '#5a3b1f', f: SKIN, b: '#4fb36b', s: '#3a3a4a' }, { h: '#2b2b2b', f: SKIN, b: '#d98f3f', s: '#3a3a4a' },
    { h: '#4a2f5a', f: SKIN, b: '#b264c9', s: '#3a3a4a' }, { h: '#333333', f: SKIN, b: '#38b2ac', s: '#3a3a4a' },
    { h: '#5a2a2a', f: SKIN, b: '#e0b83d', s: '#3a3a4a' }, { h: '#2a3a5a', f: SKIN, b: '#9ab04a', s: '#3a3a4a' },
  ];
  const fcv = $('#freezeCv'), fctx = fcv.getContext('2d', { alpha: false });
  fctx.imageSmoothingEnabled = false;
  const FW = 384, FH = 216, HZ = 74;
  function fpx(x, y, w, h, c) { fctx.fillStyle = c; fctx.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); }
  function fsprite(rows, pal, x, y, s) {
    for (let r = 0; r < rows.length; r++) for (let i = 0; i < rows[r].length; i++) {
      const k = rows[r][i];
      if (k === '.' || !pal[k]) continue;
      fpx(x + i * s, y + r * s, s, s, pal[k]);
    }
  }
  function freezeDraw() {
    const t = performance.now() / 1000;
    // 天空與草地（Mode 7 棋盤）
    fpx(0, 0, FW, HZ, '#7ba7de');
    fpx(0, 0, FW, HZ * 0.45, '#5b8bc9');
    for (let y = HZ; y < FH; y++) {
      const d = y - HZ, z = 90 / d, cw = 90 / z;
      if (cw < 2.2) { fpx(0, y, FW, 1, '#4a7742'); continue; }
      const zi = Math.floor(z);
      let ci = Math.floor((-FW / 2) * z / 90), sx = (ci - 0) * 90 / z + FW / 2;
      let g = 0;
      while (sx < FW && g++ < 200) { fpx(sx, y, cw + 1, 1, ((ci + zi) & 1) ? '#5c8f4e' : '#54864a'); sx += cw; ci++; }
    }
    // 鬼：綠燈背對、紅燈轉身
    const guard = { h: '#20222e', f: SKIN, b: '#8c3b3b', s: '#2a2a36' };
    fsprite(FZ.green ? PERSON_BACK : PERSON, guard, FW / 2 - 10, HZ - 12, 3);
    fpx(FW / 2 - 12, HZ + 16, 24, 3, 'rgba(0,0,0,.28)');
    // 玩家：progress 越高越靠近鬼
    const list = roster.filter((c) => c.connected);
    list.forEach((c, i) => {
      const st = FZ.players.find((p) => p.clientId === c.clientId) || { progress: 0, violations: 0 };
      const n = Math.max(list.length, 1);
      const x = FW * (0.10 + (i + 0.5) / n * 0.80);
      const y = FH - 34 - st.progress * 9;
      const moving = FZ.green && FZ.running;
      const bob = moving ? (Math.floor(t * 6 + i) % 2) : 0;
      fpx(x - 8, y + 19, 17, 2, 'rgba(0,0,0,.25)');
      fsprite(PERSON, PALS[i % PALS.length], x - 7, y - bob, 2);
      fctx.font = 'bold 9px sans-serif'; fctx.textAlign = 'center';
      fctx.fillStyle = '#fff'; fctx.fillText(c.name, x, y - 4);
      if (st.violations) { fctx.fillStyle = '#ff5a5a'; fctx.fillText('✗'.repeat(Math.min(3, st.violations)), x, y + 32); }
      fctx.textAlign = 'start';
    });
    // HUD：指令橫幅＋相位條
    const label = !FZ.running ? '按開始' : (FZ.green ? (FZ.cmd ? FZ.cmd.label : '') : '不要動');
    const col = !FZ.running ? '#94a3b8' : (FZ.green ? (FZ.cmd ? FZ.cmd.color : '#fff') : '#e8604c');
    fpx(0, 0, FW, 26, 'rgba(8,10,20,.82)');
    fctx.font = 'bold 17px "Noto Sans TC",sans-serif'; fctx.textAlign = 'center';
    fctx.fillStyle = col; fctx.fillText(label, FW / 2, 18);
    fctx.font = 'bold 10px ui-monospace,monospace'; fctx.fillStyle = '#94a3b8';
    fctx.textAlign = 'start'; fctx.fillText('ROUND ' + String(FZ.round).padStart(2, '0'), 6, 17);
    if (FZ.running) {
      const left = Math.max(0, (FZ.phaseEnd - performance.now()) / FZ.phaseLen);
      fpx(FW / 2 - 60, 28, 120, 3, 'rgba(255,255,255,.15)');
      fpx(FW / 2 - 60, 28, 120 * left, 3, col);
    }
    requestAnimationFrame(freezeDraw);
  }
  requestAnimationFrame(freezeDraw);

  // ================= 遊戲一：顏色反應 =================
  // CIELAB(D65) → sRGB，ΔE 用 CIE76（Lab 空間歐氏距離），POC 足夠
  function lab2rgb(L, a, b) {
    const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
    const f3 = (t) => (t ** 3 > 0.008856 ? t ** 3 : (t - 16 / 116) / 7.787);
    const X = 0.95047 * f3(fx), Y = 1.0 * f3(fy), Z = 1.08883 * f3(fz);
    let r = X * 3.2406 - Y * 1.5372 - Z * 0.4986;
    let g = -X * 0.9689 + Y * 1.8758 + Z * 0.0415;
    let bl = X * 0.0557 - Y * 0.204 + Z * 1.057;
    const gam = (c) => (c > 0.0031308 ? 1.055 * c ** (1 / 2.4) - 0.055 : 12.92 * c);
    r = gam(r); g = gam(g); bl = gam(bl);
    if (r < 0 || r > 1 || g < 0 || g > 1 || bl < 0 || bl > 1) return null; // 出色域
    const h = (c) => Math.round(c * 255).toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(bl);
  }
  // 產一局：基準色 + 三個距離 ≈ ΔE 的干擾色（干擾色彼此也要拉開）
  function genColorRound(dE) {
    for (let t = 0; t < 200; t++) {
      const base = { L: 45 + Math.random() * 30, a: -45 + Math.random() * 90, b: -45 + Math.random() * 90 };
      if (!lab2rgb(base.L, base.a, base.b)) continue;
      const labs = [base];
      let ok = true;
      for (let k = 0; k < 3 && ok; k++) {
        let placed = false;
        for (let u = 0; u < 60; u++) {
          // 隨機方向（L 分量壓小，主要在色度平面移動）
          let dx = Math.random() - 0.5, dy = Math.random() - 0.5, dz = (Math.random() - 0.5) * 0.4;
          const n = Math.hypot(dx, dy, dz) || 1;
          const cand = { L: base.L + (dz / n) * dE, a: base.a + (dx / n) * dE, b: base.b + (dy / n) * dE };
          if (!lab2rgb(cand.L, cand.a, cand.b)) continue;
          const minSep = labs.slice(1).every((o) => Math.hypot(cand.L - o.L, cand.a - o.a, cand.b - o.b) >= dE * 0.6);
          if (!minSep) continue;
          labs.push(cand); placed = true; break;
        }
        if (!placed) ok = false;
      }
      if (!ok) continue;
      const colors = labs.map((l) => lab2rgb(l.L, l.a, l.b));
      // 目標色隨機放在 0-3 其中一格（廣播給 client 的順序含目標，client 端再自行打亂位置）
      const targetIdx = Math.floor(Math.random() * 4);
      const arranged = colors.slice(1);
      arranged.splice(targetIdx, 0, colors[0]);
      return { colors: arranged, targetIdx };
    }
    return null;
  }
  const TIERS = (r) => (r <= 5 ? 100 : r <= 10 ? 40 : r <= 15 ? 15 : 7);
  let cg = null; // {round, scores:Map, roundDone, advTimer}
  $('#colorStartBtn').addEventListener('click', () => {
    sock.send({ type: 'stage', stage: 'color' });
    setActiveBtn('color');
    cg = { round: 0, scores: new Map(), advTimer: null };
    $('#colorBoard').innerHTML = '';
    nextColorRound();
  });
  function nextColorRound() {
    if (!cg) return;
    clearTimeout(cg.advTimer);
    cg.round++;
    if (cg.round > 20) return finishColor();
    const dE = TIERS(cg.round);
    const spec = genColorRound(dE);
    if (!spec) { cg.round--; cg.advTimer = setTimeout(nextColorRound, 100); return; }
    cg.answers = new Map();
    // 準備 1.2 秒（灰畫面）→ 出題
    const sw = $('#targetSwatch');
    sw.style.background = '#1e293b';
    sw.textContent = `第 ${cg.round} 局`;
    $('#colorRoundInfo').textContent = `ΔE ≈ ${dE}（第 ${cg.round}/20 局）`;
    setTimeout(() => {
      if (!cg || cg.round > 20) return;
      sock.send({ type: 'colorRound', round: cg.round, deltaE: dE, colors: spec.colors, targetIdx: spec.targetIdx });
      sw.style.background = spec.colors[spec.targetIdx];
      sw.textContent = '';
      // 兜底：6 秒沒人答完也進下一局
      cg.advTimer = setTimeout(nextColorRound, 6000);
    }, 1200);
  }
  sock.on('colorPick', (m) => {
    if (!cg) return;
    feed(`${m.name} 第${m.round}局 ${m.correct ? `✓ ${Math.round(m.reactionMs)}ms 第${m.rank}快` : '✗'}`);
    if (m.correct) {
      const pts = Math.max(1, 6 - m.rank); // 第1快+5、第2快+4…
      cg.scores.set(m.clientId, { name: m.name, score: (cg.scores.get(m.clientId)?.score || 0) + pts });
    } else if (!cg.scores.has(m.clientId)) {
      cg.scores.set(m.clientId, { name: m.name, score: 0 });
    }
    cg.answers.set(m.clientId, m);
    renderColorBoard(m.round);
    const online = roster.filter((c) => c.connected).length;
    if (cg.answers.size >= online && online > 0) {
      clearTimeout(cg.advTimer);
      cg.advTimer = setTimeout(nextColorRound, 1600);
    }
  });
  function renderColorBoard(round) {
    const rows = [...cg.scores.entries()].sort((a, b) => b[1].score - a[1].score);
    $('#colorBoard').innerHTML = rows.map(([id, s]) => {
      const a = cg.answers.get(id);
      return `<tr><td><b>${esc(s.name)}</b></td>` +
        `<td>${a && a.round === round ? (a.correct ? '✓' : '✗') : '…'}</td>` +
        `<td>${a && a.round === round && a.correct ? Math.round(a.reactionMs) + 'ms' : '–'}</td>` +
        `<td><b>${s.score}</b></td></tr>`;
    }).join('');
  }
  function finishColor() {
    const scores = [...cg.scores.values()].sort((a, b) => b.score - a.score);
    sock.send({ type: 'colorEnd', scores });
    const sw = $('#targetSwatch');
    sw.style.background = '#1e293b';
    sw.textContent = scores.length ? `🏆 ${scores[0].name}` : '結束';
    $('#colorRoundInfo').textContent = '20 局結束 — 記得匯出 JSON';
    cg = null;
  }

  // ================= 遊戲二：滑雪下坡 =================
  // 10Hz 上報 → 60fps 插值（外插 + 追趕），鏡頭跟著領先者
  const skiPlayers = new Map(); // clientId -> {name, dist, speed, atMs(perf), disp, final}
  let skiRace = null; // {startAt, duration}
  $('#skiStartBtn').addEventListener('click', () => {
    sock.send({ type: 'stage', stage: 'ski' });
    setActiveBtn('ski');
    skiPlayers.clear();
    $('#skiResults').textContent = '';
    sock.send({ type: 'skiStart', duration: 30000 });
  });
  sock.on('skiStart', (m) => {
    skiRace = { startAt: m.startAt, duration: m.duration };
    requestAnimationFrame(skiDraw);
  });
  sock.on('skiRun', (m) => {
    const p = skiPlayers.get(m.clientId) || { name: m.name, dist: 0, speed: 0, disp: 0, final: null };
    p.name = m.name; p.dist = m.distance; p.speed = m.speed; p.atMs = performance.now();
    skiPlayers.set(m.clientId, p);
  });
  sock.on('skiDone', (m) => {
    const p = skiPlayers.get(m.clientId);
    if (p) { p.final = m.distance; p.dist = m.distance; p.speed = 0; }
    const done = [...skiPlayers.values()].filter((x) => x.final != null);
    if (done.length === skiPlayers.size) {
      const rank = done.sort((a, b) => b.final - a.final);
      $('#skiResults').innerHTML = '🏁 ' + rank.map((p, i) => `${i + 1}. <b>${esc(p.name)}</b> ${p.final.toFixed(1)}m`).join(' · ');
    }
  });
  function skiDraw() {
    const cv = $('#skiCanvas'), ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const now = hostClock.serverNow() ?? Date.now();
    if (!skiRace) return;
    const elapsed = now - skiRace.startAt;
    $('#skiTimerLbl').textContent = elapsed < 0 ? `倒數 ${Math.ceil(-elapsed / 1000)}` :
      elapsed < skiRace.duration ? `剩 ${Math.ceil((skiRace.duration - elapsed) / 1000)} 秒` : '結束';
    const ids = [...skiPlayers.keys()];
    const laneW = W / Math.max(ids.length, 1);
    // 插值：目標 = 最後上報距離 + 速度外插，顯示值朝目標追趕
    let lead = 0;
    for (const p of skiPlayers.values()) {
      const ext = p.final != null ? p.final : p.dist + (p.speed || 0) * Math.min((performance.now() - (p.atMs || 0)) / 1000, 1);
      p.disp += (ext - p.disp) * 0.12;
      lead = Math.max(lead, p.disp);
    }
    const SPAN = 90; // 畫面涵蓋 90m
    const cam = Math.max(0, lead - SPAN * 0.75); // 領先者在 75% 高度
    const y = (d) => ((d - cam) / SPAN) * H;
    // 雪道背景：淡藍雪地 + 樹
    ctx.fillStyle = '#f4f9fe'; ctx.fillRect(0, 0, W, H);
    ctx.font = '16px serif';
    for (let d = Math.floor(cam / 15) * 15; d < cam + SPAN + 15; d += 15) {
      const ty = y(d);
      ctx.fillStyle = '#9fc3e0';
      for (let i = 0; i <= ids.length; i++) {
        ctx.fillText('🌲', i * laneW - 8 + (d % 30 ? 6 : -6), ty);
      }
      ctx.fillStyle = '#c5d9ea';
      ctx.fillText(d + 'm', 6, ty - 4);
    }
    // 分道線 + 玩家
    ids.forEach((id, i) => {
      const p = skiPlayers.get(id);
      ctx.strokeStyle = '#dde9f3';
      ctx.beginPath(); ctx.moveTo(i * laneW, 0); ctx.lineTo(i * laneW, H); ctx.stroke();
      const cx = i * laneW + laneW / 2;
      const sy = Math.min(y(p.disp), H - 24);
      const sway = Math.sin(performance.now() / 180 + i) * Math.min(p.speed || 0, 6) * 1.2;
      ctx.font = '30px serif';
      ctx.fillText('⛷️', cx - 15 + sway, sy);
      ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#1b2733'; ctx.textAlign = 'center';
      ctx.fillText(`${p.name} ${p.disp.toFixed(0)}m`, cx, 22);
      ctx.textAlign = 'start';
    });
    if (elapsed < skiRace.duration + 3000) requestAnimationFrame(skiDraw);
  }

  // ---- 匯出：POC 唯一真正的交付物 ----
  async function doExport() {
    const res = await fetch(`/export/${roomId}`);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mahou-${roomId}-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  $('#exportBtn').addEventListener('click', doExport);

  // ---- 結束房間（計費防呆）：先自動匯出一次，再踢掉所有連線讓 DO 休眠 ----
  $('#endBtn').addEventListener('click', async () => {
    if (!confirm('結束房間？會先自動匯出 JSON，然後踢掉所有人。')) return;
    await doExport();
    sock.send({ type: 'endRoom' });
  });
  sock.onEnded((reason) => {
    $('#connState').textContent = `⏹ 房間已結束（${reason}）`;
    document.querySelectorAll('button[data-stage], #endBtn').forEach((b) => (b.disabled = true));
  });

  // ---- 畫面 ----
  const fmt = (v, d = 1) => (v == null ? '–' : (+v).toFixed(d));
  function renderRoster() {
    const tb = $('#roster');
    tb.innerHTML = '';
    for (const c of roster) {
      const s = stat(c.clientId);
      const ups = [...s.uplinks].sort((a, b) => a - b);
      const rtt = c.sync?.rtt;
      const dev = c.device ? `${(c.device.platform || '?')} ${c.device.screen?.w}×${c.device.screen?.h}` : '–';
      const tr = document.createElement('tr');
      tr.id = 'row-' + c.clientId;
      if (!c.connected) tr.className = 'offline';
      tr.innerHTML =
        `<td><b>${esc(c.name)}</b></td>` +
        `<td title="${esc(c.device?.ua || '')}">${esc(dev)}</td>` +
        `<td>${c.device?.motionEventRateHz ?? '–'}</td>` +
        `<td class="${Mahou.rttClass(rtt?.p50)}">${rtt ? `${fmt(rtt.min)} / ${fmt(rtt.p50)} / ${fmt(rtt.p95)}` : '–'}</td>` +
        `<td class="${(rtt?.lost ?? 0) > 0 ? 'warn' : ''}">${rtt ? `${rtt.lost}/${rtt.samples + rtt.lost}` : '–'}</td>` +
        `<td class="${Math.abs(c.sync?.drift ?? 0) > 20 ? 'bad' : ''}">${fmt(c.sync?.drift)}</td>` +
        `<td>${ups.length ? `${Mahou.pct(ups, 50)} / ${Mahou.pct(ups, 95)}` : '–'}</td>` +
        `<td class="${s.spam && s.spam.lossPct > 1 ? 'bad' : ''}">${s.spam ? s.spam.lossPct + '%' : '–'}</td>` +
        `<td>${s.shake || '–'}</td>`;
      tb.appendChild(tr);
    }
  }
  function flashRow(clientId) {
    const tr = document.getElementById('row-' + clientId);
    if (!tr) return;
    tr.classList.add('flash');
    setTimeout(() => tr.classList.remove('flash'), 150);
  }
  function renderSummary() {
    // §12 表格能自動算的先自動算
    const allUps = [...stats.values()].flatMap((s) => s.uplinks).sort((a, b) => a - b);
    const worstDrift = Math.max(0, ...roster.map((c) => Math.abs(c.sync?.drift ?? 0)));
    const worstLoss = Math.max(0, ...[...stats.values()].map((s) => s.spam?.lossPct ?? 0));
    $('#summary').innerHTML =
      `單點上行延遲（全體）：p50 <b>${Mahou.pct(allUps, 50) ?? '–'}</b> / p95 <b>${Mahou.pct(allUps, 95) ?? '–'}</b> ms（n=${allUps.length}）<br>` +
      `最大 clock 漂移：<b>${worstDrift.toFixed(1)}</b> ms（門檻 20ms）<br>` +
      `最差狂點掉包率：<b>${worstLoss}%</b>（門檻 1%）<br>` +
      `搖動計數：${roster.map((c) => `${esc(c.name)} ${stat(c.clientId).shake}`).join('、') || '–'}（同一人換裝置比差異 %）`;
  }
  const feedEl = $('#feed');
  function feed(text) {
    const line = document.createElement('div');
    line.textContent = `${new Date().toLocaleTimeString()} ${text}`;
    feedEl.prepend(line);
    while (feedEl.childNodes.length > 100) feedEl.lastChild.remove();
  }
  function esc(s) { const d = document.createElement('span'); d.textContent = s ?? ''; return d.innerHTML; }
})();
</script>
</body>

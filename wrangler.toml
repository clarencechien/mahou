name = "mahou"
main = "worker/index.js"
compatibility_date = "2025-11-01"

# 靜態頁面（host.html / client.html / shared.js）
assets = { directory = "./public", binding = "ASSETS" }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# SQLite-backed DO：Free plan 也能用，Deploy to Cloudflare 按鈕直接可部署
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[observability]
enabled = true
